        }

        function masterById(id) {
            var result = null;
            Object.keys(masterByMode).some(function(mode) {
                if (masterByMode[mode].id === id) {
                    result = masterByMode[mode];
                    return true;
                }
                return false;
            });
            return result;
        }

        function isMonoMasterMeterSource(master) {
            return master && (master.id === "aux1" || master.id === "aux2" || master.id === "aux3" || master.id === "aux4");
        }

        function meterDisplayContext() {
            var channels = allChannels().filter(function(channel) { return !!state.solo[channel.id]; });
            if (channels.length) {
                var labels = channels.map(channelMeterLabel);
                var title = channels.length > 1 ? "sum of: " + labels.join(", ") : labels[0];
                var stereo = channels.some(isStereoWidthSource);
                return { leftLabel: stereo ? "L\\ " + title : title, rightLabel: stereo ? "R\\ " + title : "", stereo: stereo };
            }

            var masterId = state.activeMasterSoloTarget || activeManualMasterSoloTarget() || "stereo";
            var master = masterById(masterId) || masterByMode.MIX;
            var label = master.label;
            var masterStereo = !isMonoMasterMeterSource(master);
            return { leftLabel: masterStereo ? "L\\ " + label : label, rightLabel: masterStereo ? "R\\ " + label : "", stereo: masterStereo };
        }

        function knobLabel(knob, value) {
            if (knob.dataset.control === "compAmount") return value;
            if (knob.dataset.control === "compPreset") return compressorPresets[value] || compressorPresets[0];
            if (knob.classList.contains("comp") && value <= 0) return "OFF";
            return value + (knob.dataset.unit || "");
        }

        function setKnobValue(knob, value, silent) {
            var min = parseFloat(knob.dataset.min);
            var max = parseFloat(knob.dataset.max);
            var stepSize = parseFloat(knob.dataset.step || "1");
            var stepped = Math.round(Math.max(min, Math.min(max, value)) / stepSize) * stepSize;
            stepped = Math.round(stepped * 100) / 100;
            if (knob.dataset.detent === "center") {
                var center = parseFloat(knob.dataset.center || "0");
                if (Math.abs(stepped - center) <= 1) stepped = center;
            }
            var percent = (stepped - min) / (max - min);
            if (knob.dataset.scale === "log") {
                var safeMin = Math.max(1, min);
                percent = (Math.log(Math.max(safeMin, stepped)) - Math.log(safeMin)) / (Math.log(max) - Math.log(safeMin));
            }
            var angleMin = parseFloat(knob.dataset.angleMin || "-135");
            var angleMax = parseFloat(knob.dataset.angleMax || "135");
            var angleRange = angleMax - angleMin;
            var knobAngle = angleMin + percent * angleRange;
            knob.dataset.value = stepped;
            knob.style.setProperty("--angle", knobAngle + "deg");
            knob.textContent = knobLabel(knob, stepped);
            knob.dataset.lastAngle = String(knobAngle);
            if (knob.dataset.control) {
                var channel = selectedChannel();
                var controls = channelControls(channel);
                controls[knob.dataset.control] = stepped;
                if (knob.dataset.control === "compPreset") {
                    controls.compPresetIndex = stepped;
                    controls.comp = stepped;
                    var presetName = compressorPresets[stepped] || compressorPresets[0];
                    var presetLabel = knob.closest(".control-cell").querySelector("[data-comp-preset-name]");
                    if (presetLabel) presetLabel.textContent = presetName;
                    if (!silent && channel.id !== "RTN1" && channel.id !== "RTN2") sendCompressorControl(channel, presetName, controls);
                } else if (knob.dataset.control === "compAmount") {
                    controls.compPosition = stepped;
                    var currentPreset = compressorPresets[controls.compPresetIndex] || compressorPresets[0];
                    if (!silent && channel.id !== "RTN1" && channel.id !== "RTN2") sendCompressorControl(channel, currentPreset, controls);
                } else {
                    if (!silent && knob.dataset.control === "pan") sendPanControl(channel, stepped);
                    if (!silent && knob.dataset.control === "stereoPan") sendStereoSpreadControl(channel, controls.stereoSpreadMode, stepped);
                    if (!silent && knob.dataset.eq === "1") sendEqControl(channel, knob.dataset.control, stepped);
                }
            }
            if (knob.dataset.masterEq) {
                var master = masterByMode[state.mode];
                masterEqControls(master)[knob.dataset.masterEq] = stepped;
                if (!silent) {
                    var masterEqControl = {
                        low: "lowGain",
                        lowMid: "lowMidGain",
                        highMid: "highMidGain",
                        high: "highGain"
                    }[knob.dataset.masterEq];
                    if (masterEqControl) sendMasterEqControl(master, masterEqControl, stepped);
                    var auxEqControl = {
                        auxNotch1Freq: "lowNotchFreq",
                        auxNotch2Freq: "highNotchFreq",
                        auxPresence: "presence"
                    }[knob.dataset.masterEq];
                    if (auxEqControl) sendAuxEqControl(master, auxEqControl, stepped);
                }
            }
            if (knob.dataset.effectReturnEq) {
                var returnChannel = selectedChannel();
                var returnControls = channelControls(returnChannel);
                returnControls[knob.dataset.effectReturnEq] = stepped;
                if (!silent) sendEffectReturnEqControl(returnChannel, {
                    effectReturnLow: "low",
                    effectReturnMid: "mid",
                    effectReturnAir: "air"
                }[knob.dataset.effectReturnEq], stepped);
            }
            if (knob.dataset.rawEqQ) {
                var rawIsMaster = knob.dataset.rawEqOwner === "master";
                var rawOwner = rawIsMaster ? masterByMode[state.mode] : selectedChannel();
                var raw = rawEqState(rawOwner, rawIsMaster);
                var bandKey = knob.dataset.rawEqQ;
                raw[bandKey].q = stepped;
                if (!silent) sendRawEq(rawOwner, rawIsMaster);
            }
            if (knob.dataset.channelAtt) {
                var attChannel = selectedChannel();
                var attControls = channelControls(attChannel);
                attControls.eqAtt = stepped;
                if (!silent) sendChannelAttenuation(attChannel, stepped);
            }
            if (knob.dataset.masterComp) {
                var masterForComp = masterByMode[state.mode];
                var masterCompControls = masterEqControls(masterForComp);
                masterCompControls[knob.dataset.masterComp] = stepped;
                masterCompControls.compOn = true;
                if (!silent) sendMasterCompressorParameter(masterForComp, knob.dataset.masterComp, stepped);
            }
        }

        function valueFromPointer(knob, event) {
            var rect = knob.getBoundingClientRect();
            var centerX = rect.left + rect.width / 2;
            var centerY = rect.top + rect.height / 2;
            var angle = Math.atan2(event.clientY - centerY, event.clientX - centerX) * 180 / Math.PI;
            var relative = angle + 90;
            if (relative < -180) relative += 360;
            if (relative > 180) relative -= 360;
            var currentValue = parseFloat(knob.dataset.value || knob.dataset.min || "0");
            var lastAngle = parseFloat(knob.dataset.lastAngle || "0");
            var angleMin = parseFloat(knob.dataset.angleMin || "-135");
            var angleMax = parseFloat(knob.dataset.angleMax || "135");
            var angleRange = angleMax - angleMin;
            if (relative < angleMin || relative > angleMax) {
                return currentValue;
            }
            if (Math.abs(relative - lastAngle) > 180) {
                return currentValue;
            }
            var clamped = Math.max(angleMin, Math.min(angleMax, relative));
            var min = parseFloat(knob.dataset.min);
            var max = parseFloat(knob.dataset.max);
            if (knob.dataset.scale === "log") {
                var safeMin = Math.max(1, min);
                var logValue = Math.log(safeMin) + ((clamped - angleMin) / angleRange) * (Math.log(max) - Math.log(safeMin));
                return Math.exp(logValue);
            }
            return min + ((clamped - angleMin) / angleRange) * (max - min);
        }

        function bindKnobs(root) {
            Array.prototype.forEach.call(root.querySelectorAll(".knob[data-min]"), function(knob) {
                setKnobValue(knob, parseFloat(knob.dataset.value || "0"), true);
                knob.onpointerdown = function(event) {
                    event.preventDefault();
                    knob.setPointerCapture(event.pointerId);
                    setKnobValue(knob, valueFromPointer(knob, event));
                };
                knob.onpointermove = function(event) {
                    if (!knob.hasPointerCapture(event.pointerId)) return;
                    setKnobValue(knob, valueFromPointer(knob, event));
                };
            });
        }

        function renderSendRow(id, value, disabled) {

        }

        function sendParameterForSend(channel, id, value) {
            if (channel && channel.id === "RTN1" && id === "eff1") return;
            if (channel && channel.id === "RTN2" && id === "eff2") return;
            var modeMap = {
                aux1: "auxSend.AUX1.",
                aux2: "auxSend.AUX2.",
                aux3: "auxSend.AUX3.",
                aux4: "auxSend.AUX4.",
                eff1: "fx2Send.",
                eff2: "fx1Send."
            };
            var effectReturnMap = {
                aux1: "effectReturnSend.aux1.",
                aux2: "effectReturnSend.aux2.",
                aux3: "effectReturnSend.aux3.",
                aux4: "effectReturnSend.aux4.",
                eff1: "effectReturnSend.eff1.",
                eff2: "effectReturnSend.eff2.",
                MIX: "effectReturnSend.master."
            };
            if (channel.id === "RTN1" || channel.id === "RTN2") {
                var returnId = channel.id === "RTN1" ? "effRtn1" : "effRtn2";
                var returnPrefix = effectReturnMap[id] || effectReturnMap[state.mode] || null;
                if (!returnPrefix) return;
                sendParameter(returnPrefix + returnId, dbToMidi(value));
                return;
            }
            var prefix = modeMap[id];
            if (!prefix || !channel) return;
            var midiValue = dbToMidi(value);
            sendParameter(prefix + channel.midiKey, midiValue);

        function panCellHtml(channel, controls, extraClass) {
            var className = "control-cell" + (extraClass ? " " + extraClass : "");
            if (isStereoWidthSource(channel)) {
                var mode = controls.stereoSpreadMode || "Stereo";
                var config = stereoSpreadConfig[mode] || stereoSpreadConfig.Stereo;
                var min = config.panRange[0];
                var max = config.panRange[1];
                if (controls.stereoPan < min) controls.stereoPan = min;
                if (controls.stereoPan > max) controls.stereoPan = max;
                var panControl = config.panDisabled ?
                    "<div class='knob disabled'>0</div>" :
                    "<div class='knob' data-control='stereoPan' data-min='" + min + "' data-max='" + max + "' data-center='0' data-detent='center' data-value='" + controls.stereoPan + "' data-unit=''>0</div>";
                return [
                    "<div class='" + className + "'><div class='control-label'>PAN</div><div class='pan-stereo-stack'>",
                    "<div class='mini-row'><div class='value-box swipe-value' data-stereo-spread='1'>" + mode + "</div></div>",

            return "<div class='" + className + "'><div class='control-label'>PAN</div><div class='knob' data-control='pan' data-min='-16' data-max='16' data-center='0' data-detent='center' data-value='" + controls.pan + "' data-unit=''>0</div></div>";
        }

        function bindStripButtons(root, channel) {
            var controls = channelControls(channel);
            function stepMidFrequency(step, valueBox) {
                var next = Math.max(0, Math.min(midFreqPresets.length - 1, controls.midFreqIndex + step));
                if (next === controls.midFreqIndex) return;
                controls.midFreqIndex = next;
                sendEqControl(channel, "midFrequency", midFreqPresets[controls.midFreqIndex]);
                if (valueBox) valueBox.textContent = midFreqPresets[controls.midFreqIndex];
            }

            function stepStereoSpread(step, valueBox) {
                var current = stereoSpreadPresets.indexOf(controls.stereoSpreadMode || "Stereo");
                if (current < 0) current = 0;
                var next = Math.max(0, Math.min(stereoSpreadPresets.length - 1, current - step));
                if (next === current) return;
                controls.stereoSpreadMode = stereoSpreadPresets[next];
                var config = stereoSpreadConfig[controls.stereoSpreadMode] || stereoSpreadConfig.Stereo;
                controls.stereoPan = Math.max(config.panRange[0], Math.min(config.panRange[1], controls.stereoPan || 0));
                sendStereoSpreadControl(channel, controls.stereoSpreadMode, controls.stereoPan);
                if (valueBox) valueBox.textContent = controls.stereoSpreadMode;
                renderStripPage();
            }

            function stepSendValue(row, step) {
                if (!row || row.dataset.disabled === "1") return;
                var id = row.dataset.send;
                var next = Math.max(-70, Math.min(0, controls[id] + step));
                if (next === controls[id]) return;
                controls[id] = next;
                sendParameterForSend(channel, id, controls[id]);
                var linked = linkedAuxSendId(id);
                if (linked) {
                    controls[linked] = next;
                    sendParameterForSend(channel, linked, controls[linked]);
                }
                var valueBox = row.querySelector(".value-box");
                if (valueBox) valueBox.textContent = controls[id];
            }

            function stepCompPreset(valueBox, step) {
                var next = Math.max(0, Math.min(compressorPresets.length - 1, controls.compPresetIndex + step));
                if (next === controls.compPresetIndex) return;
                controls.compPresetIndex = next;
                controls.comp = next;
                controls.compPosition = 64;
                var presetName = compressorPresets[next] || compressorPresets[0];
                valueBox.textContent = presetName;
                var knob = root.querySelector("[data-control='compAmount']");
                if (knob) setKnobValue(knob, controls.compPosition, true);
                sendCompressorControl(channel, presetName, controls);
            }

            function bindSwipeValue(valueBox, callback) {
                var swipe = null;
                function direction(event) {
                    var dx = event.clientX - swipe.lastX;
                    var dy = swipe.lastY - event.clientY;
                    var amount = Math.abs(dx) > Math.abs(dy) ? dx : dy;
                    if (Math.abs(amount) < 26) return 0;
                    swipe.lastX = event.clientX;
                    swipe.lastY = event.clientY;
                    return amount > 0 ? 1 : -1;
                }
                valueBox.onpointerdown = function(event) {
                    event.preventDefault();
                    valueBox.setPointerCapture(event.pointerId);
                    swipe = {
                        pointerId: event.pointerId,
                        lastX: event.clientX,
                        lastY: event.clientY
                    };
                };
                valueBox.onpointermove = function(event) {
                    if (!swipe || event.pointerId !== swipe.pointerId) return;
                    if ((valueBox.dataset.midfreq || valueBox.dataset.compPresetSwipe || valueBox.dataset.stereoSpread) && swipe.done) return;
                    var dir = direction(event);
                    if (dir) {
                        callback(dir, valueBox);
                        if (valueBox.dataset.midfreq || valueBox.dataset.compPresetSwipe || valueBox.dataset.stereoSpread) swipe.done = true;
                    }
                };
                valueBox.onpointerup = valueBox.onpointercancel = function(event) {
                    if (valueBox.hasPointerCapture && valueBox.hasPointerCapture(event.pointerId)) {
                        valueBox.releasePointerCapture(event.pointerId);
                    }
                    swipe = null;
                };
            }

            Array.prototype.forEach.call(root.querySelectorAll("[data-hpf]"), function(button) {
                button.onclick = function() {
                    controls.hpf = controls.hpf === button.dataset.hpf ? null : button.dataset.hpf;
                    sendEqControl(channel, "hpf", controls.hpf);
                    renderStripPage();
                };
            });
            var phase = root.querySelector("[data-phase]");
            if (phase) {
                phase.onclick = function() {
                    if (!phaseCapable(channel)) return;
                    controls.phase = !controls.phase;
                    setChannelPhase(channel.midiKey, controls.phase);
                    renderStripPage();
                };
            }
            Array.prototype.forEach.call(root.querySelectorAll("[data-midfreq]"), function(valueBox) {
                bindSwipeValue(valueBox, function(dir, box) {
                    stepMidFrequency(dir, box);
                });
            });
            Array.prototype.forEach.call(root.querySelectorAll("[data-stereo-spread]"), function(valueBox) {
                bindSwipeValue(valueBox, function(dir, box) {
                    stepStereoSpread(dir, box);
                });
            });
            Array.prototype.forEach.call(root.querySelectorAll("[data-send]"), function(row) {
                if (row.dataset.disabled === "1") return;
                Array.prototype.forEach.call(row.querySelectorAll("[data-swipe-send]"), function(valueBox) {
                    bindSwipeValue(valueBox, function(dir) {
                        stepSendValue(row, dir * 2);
                    });
                });
            });
            Array.prototype.forEach.call(root.querySelectorAll("[data-comp-preset-swipe]"), function(valueBox) {
                bindSwipeValue(valueBox, function(dir) {
                    stepCompPreset(valueBox, dir);
                });
            });
        }

        function renderRatioSelector(eq) {

        }

        function renderAuxNotchCell(id, label, freq, gainIndex, minFreq, maxFreq) {

        function renderMasterToneEqCell(label, gainKey, freqKey, eq) {

            return [

        function bindAuxMasterEq(page, master) {
            var eq = masterEqControls(master);
            Array.prototype.forEach.call(page.querySelectorAll("[data-aux-master-hpf]"), function(button) {
                button.onclick = function() {
                    eq.auxHpf = eq.auxHpf === button.dataset.auxMasterHpf ? null : button.dataset.auxMasterHpf;
                    sendAuxEqControl(master, "hpf", eq.auxHpf);

                };
            });
            Array.prototype.forEach.call(page.querySelectorAll("[data-aux-notch-gain]"), function(valueBox) {
                var swipe = null;
                var lastTap = 0;
                valueBox.ondblclick = function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    return false;
                };
                valueBox.onclick = function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    return false;
                };
                valueBox.onpointerdown = function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    valueBox.setPointerCapture(event.pointerId);
                    swipe = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, done: false, moved: false };
                };
                valueBox.onpointermove = function(event) {
                    if (!swipe || swipe.done || event.pointerId !== swipe.pointerId) return;
                    event.preventDefault();
                    event.stopPropagation();
                    var dx = event.clientX - swipe.startX;
                    var dy = event.clientY - swipe.startY;
                    var horizontal = Math.abs(dx) > Math.abs(dy);
                    var amount = horizontal ? dx : dy;
                    if (Math.abs(amount) < 26) return;
                    var key = "auxNotch" + valueBox.dataset.auxNotchGain + "GainIndex";
                    var initKey = "auxNotch" + valueBox.dataset.auxNotchGain + "Init";
                    swipe.moved = true;
                    if (eq[initKey]) {
                        eq[initKey] = false;
                        eq[key] = 0;
                        valueBox.textContent = auxNotchGainPresets[eq[key]] + " dB";
                        sendAuxEqControl(master, valueBox.dataset.auxNotchGain === "1" ? "lowNotchGain" : "highNotchGain", auxNotchGainPresets[eq[key]]);
                        swipe.done = true;
                        return;
                    }
                    var step = horizontal ? (amount < 0 ? 1 : -1) : (amount > 0 ? 1 : -1);
                    var next = Math.max(0, Math.min(auxNotchGainPresets.length - 1, eq[key] + step));
                    if (next !== eq[key]) {
                        eq[key] = next;
                    }
                    valueBox.textContent = auxNotchGainPresets[eq[key]] + " dB";
                    sendAuxEqControl(master, valueBox.dataset.auxNotchGain === "1" ? "lowNotchGain" : "highNotchGain", auxNotchGainPresets[eq[key]]);
                    swipe.done = true;
                };
                valueBox.onpointerup = valueBox.onpointercancel = function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    if (valueBox.hasPointerCapture && valueBox.hasPointerCapture(event.pointerId)) {
                        valueBox.releasePointerCapture(event.pointerId);
                    }
                    if (swipe && !swipe.moved && event.type === "pointerup") {
                        var now = Date.now();
                        var key = "auxNotch" + valueBox.dataset.auxNotchGain + "GainIndex";
                        var initKey = "auxNotch" + valueBox.dataset.auxNotchGain + "Init";
                        var gainControl = valueBox.dataset.auxNotchGain === "1" ? "lowNotchGain" : "highNotchGain";
                        if (eq[initKey]) {
                            eq[initKey] = false;
                            eq[key] = 0;
                            valueBox.textContent = auxNotchGainPresets[eq[key]] + " dB";
                            sendAuxEqControl(master, gainControl, auxNotchGainPresets[eq[key]]);
                            lastTap = 0;
                        } else if (now - lastTap < 350) {
                            eq[initKey] = true;
                            valueBox.textContent = "INIT";
                            sendAuxEqControl(master, gainControl, 12);
                            lastTap = 0;
                        } else {
                            lastTap = now;
                        }
                    }
                    swipe = null;
                };
            });
        }

        function bindMasterComp(page, master) {
            var eq = masterEqControls(master);
            Array.prototype.forEach.call(page.querySelectorAll("[data-master-comp-preset]"), function(button) {
                button.onclick = function() {

                        eq.compStyle = null;

                        sendMasterCompressorOn(master, false);

                        eq.compPreset = preset;

            });
            Array.prototype.forEach.call(page.querySelectorAll("[data-ratio-value]"), function(valueBox) {
                var swipe = null;
                valueBox.onpointerdown = function(event) {
                    event.preventDefault();
                    valueBox.setPointerCapture(event.pointerId);
                    swipe = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, done: false };
                };
                valueBox.onpointermove = function(event) {
                    if (!swipe || swipe.done || event.pointerId !== swipe.pointerId) return;
                    var dx = event.clientX - swipe.startX;
                    var dy = swipe.startY - event.clientY;
                    var amount = Math.abs(dx) > Math.abs(dy) ? dx : dy;
                    if (Math.abs(amount) < 26) return;
                    var step = amount > 0 ? 1 : -1;
                    var next = Math.max(0, Math.min(ratioPresets.length - 1, eq.ratioIndex + step));
                    if (next !== eq.ratioIndex) {

                    if (state.sceneResetUndo && state.sceneResetUndo.scene === scene) {
                        restoreSceneReset(state.sceneResetUndo.snapshot);
                        return;
                    }
                    if (state.pendingConfirm && state.pendingConfirm.action === "resetScene" && state.pendingConfirm.scene === scene) {
                        startSceneReset(scene);
                        return;

                    if (event.detail >= 2 || (lastSceneButtonTap.scene === scene && now - lastSceneButtonTap.time < 450)) {
                        lastSceneButtonTap = { scene: null, time: 0 };
                        state.selectedScene = scene;
                        startSceneReset(scene);

        function renderMaster() {
            var root = document.getElementById("masterStrip");

            var autoMixMasterSolo = isAutoMixMasterSolo(master);
            var solo = document.createElement("button");
            solo.className = "btn-hw solo" + (masterMeterActive ? " on" : "");
            solo.textContent = "SOLO";
            solo.onclick = function() {
                if (autoMixMasterSolo || !canInvokeSolo()) return;
                var next = !state.masterSolo[master.id];
                if (next) prepareMasterSoloSelection(master.id);
                state.masterSolo[master.id] = next;
                updateRawEqSnapshotCache();
                syncSoloRouting();
                render();
            };

            var title = document.createElement("div");
            title.className = "master-title";
            title.textContent = master.label;

            var faderBox = document.createElement("div");
            faderBox.className = "fader-box" + (masterMeterActive ? " channel-meter-fader-box" : "");
            var fader = document.createElement("input");
            fader.className = "v-fader" + (masterMeterActive ? " meter-fader" : "");
            fader.type = "range";
            fader.min = "0";
            fader.max = "127";
            fader.step = "1";
            fader.value = midiFaderValue(state.master[key]);
            fader.oninput = function(event) {
                var value = setMasterFaderValue(key, event.target.value);
                event.target.value = value;
                sendParameter(key, value);
                var linkedMode = linkedAuxMode(state.mode);
                if (linkedMode) {
                    var linkedMaster = masterByMode[linkedMode];
                    setMasterFaderValue(linkedMaster.parameter, value);
                    sendParameter(linkedMaster.parameter, value);
                }
            };
            if (masterMeterActive) {
                appendMeterFader(faderBox, fader, "master:" + master.id);
            } else {
                faderBox.appendChild(fader);
            }

            var on = document.createElement("button");
            on.className = "btn-hw on-btn " + (masterOnState(master) ? "on" : "off");
            on.textContent = "ON";
            on.onclick = function() {
                var next = !masterOnState(master);
                state.masterOn[master.id] = next;
                setMasterOn(master.id, next);
                renderMaster();
            };
            var select = document.createElement("button");
            var masterCopyClass = "";
            if (state.copy.source && state.copy.source.type === "masterSettings" && state.copy.source.mode === state.mode) masterCopyClass = " copy-source";
            if (copyTargetSelected("masterSettings", state.mode)) masterCopyClass = " copy-target";
            var masterSelectClass = isMeterDelegationMode() ? " solo" : (state.view === "masterStrip" ? " active" : "");
            select.className = "btn-hw master-select" + masterSelectClass + masterCopyClass;
            select.textContent = master.label;
            select.onclick = function() {
                if (isMeterDelegationMode()) {
                    var meterTapKey = "master-select:" + state.mode;
                    if (isMeterDoubleTap(meterTapKey)) {
                        cancelMeterSingleTap(meterTapKey);
                        exitMeterModeToBus(state.mode);
                        return;
                    }
                    scheduleMeterSingleTap(meterTapKey, function() {
                        if (!isMeterDelegationMode() || !canInvokeSolo()) return;
                        if (isOnlyMeterModeTarget(state.mode)) {
                            toggleMeterMasterDetail(state.mode);
                            return;
                        }
                        meterSelectCurrentMaster();
                    });
                    return;
                }
                if (state.copy.phase === "source" && state.mode !== "MIX") {
                    setCopySource({ type: "masterSettings", mode: state.mode });
                    return;
                }
                if (state.copy.phase === "targets" && state.copy.source && state.copy.source.type === "masterSettings" && state.mode !== "MIX") {
                    addCopyTarget({ type: "masterSettings", mode: state.mode });
                    return;
                }
                if (isNormalMasterDoubleTap(state.mode)) {
                    enterMeterModeWithMaster(state.mode);
                    return;
                }
                state.view = state.view === "masterStrip" ? "mixer" : "masterStrip";
                state.selectedId = "master:" + state.mode;
                state.selectedLabel = master.label;
                selectMixerMasterBus(state.mode);
                render();
            };

            root.appendChild(solo);
            root.appendChild(title);
            root.appendChild(faderBox);
            root.appendChild(on);
            root.appendChild(select);
            updateInlineMeterDom();
        }

        function renderButtonsOnly() {
            renderTopBar();
            renderChannelRow();
            renderMaster();
            if (state.view === "mixer") renderMixer();
            syncSoloRouting();
        }

        function render() {
            renderTopBar();
            renderBankBar();
            renderChannelRow();
            renderMaster();
            if (state.view === "strip") renderStripPage();
            else if (state.view === "masterStrip") renderMasterStripPage();
            else if (state.view === "scenes") renderScenesPage();
            else if (state.view === "meter") renderMeterPage();
            else renderMixer();
            syncSoloRouting();
            positionModeOverlay();
            scheduleRawEqSpectrumDraw();
        }

        document.addEventListener("pointerdown", guardPermissionEvent, true);
        document.addEventListener("click", guardPermissionEvent, true);
        document.addEventListener("input", guardPermissionEvent, true);
        window.addEventListener("pointermove", updateModeGesture, true);
        window.addEventListener("pointerup", finishModeGesture, true);
        window.addEventListener("pointercancel", finishModeGesture, true);
        window.addEventListener("resize", positionModeOverlay);
        bindModeOverlay();
        loadScenes();
        socket.on("app mode", applyAppMode);
        socket.on("midi status", applyMidiStatus);
        socket.on("scene store", applySceneStore);
        socket.on("meter config", applyMeterConfig);
        socket.on("audio meter frame", applyAudioMeterFrame);
        socket.on("audio meter request", handleAudioMeterRequest);
        socket.on("midi incoming", applyMidiIncoming);
        render();
    </script>
</body>

</html>
