<!DOCTYPE html>
<html>

<head>
    <title>01V Web Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="./assets/manifest.json">
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/style.css">
    <style>
        :root {
            --bg: #111315;
            --panel: #202326;
            --panel-dark: #0c0e10;
            --line: #343a3f;
            --text: #f2f2f2;
            --muted: #b8b8b8;
            --active: #1f7acb;
            --solo: #f0c33c;
            --on: #1fb96b;
            --off: #5a1e22;
            --channel-select-height: clamp(54px, 8vh, 74px);
            --channel-select-button-height: calc((var(--channel-select-height) - 16px) * 1.6);
            --strip-button-height: clamp(42px, 6vh, 52px);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            touch-action: none;
        }

        * {
            box-sizing: border-box;
        }

        #orientation {
            display: none !important;
        }

        .app {
            height: 100dvh;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        .top-bar {
            flex: 0 0 clamp(58px, 9vh, 86px);
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 8px;
            padding: 8px;
            background: var(--panel-dark);
            border-bottom: 1px solid var(--line);
        }

        .top-bar .btn-hw {
            width: 100%;
            height: 100%;
            min-height: 0;
            padding: 6px 8px;
        }

        .main {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            overflow: hidden;
        }

        .bank-bar {
            flex: 0 0 clamp(42px, 5.4vw, 58px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px 5px 8px;
            background: var(--panel-dark);
            border-right: 2px solid var(--line);
            position: relative;
            overflow: visible;
        }

        .center {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #171a1d;
        }

        .work-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            padding: 10px;
        }

        .channel-row {
            flex: 0 0 var(--channel-select-height);
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 6px;
            padding: 8px;
            background: var(--panel-dark);
            border-top: 1px solid var(--line);
            position: relative;
        }

        .channel-row .btn-hw {
            aspect-ratio: 1.25 / 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            line-height: 1.05;
            position: relative;
        }

        .channel-button-main {
            font-size: clamp(11px, 1.2vw, 14px);
            font-weight: 900;
        }

        .channel-button-name {
            max-width: 100%;
            font-size: clamp(9px, 1vw, 12px);
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .channel-copyright {
            position: absolute;
            right: 3px;
            bottom: 12px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: rgba(184, 184, 184, 0.58);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1;
            pointer-events: none;
        }

        .master {
            flex: 0 0 clamp(118px, 14vw, 168px);
            min-width: 112px;
            padding: 10px;
            background: var(--panel-dark);
            border-left: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
        }

        .btn-hw {
            border: 1px solid #3d444b;
            background: #272c31;
            color: var(--text);
            min-height: 42px;
            padding: 6px 8px;
            font-weight: 700;
            font-size: clamp(11px, 1.4vw, 15px);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            border-radius: 5px;
            box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.45);
        }

        .btn-hw.active {
            background: var(--active);
            border-color: #6cb5ff;
            box-shadow: 0 0 12px rgba(31, 122, 203, 0.38), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .bank-bar .btn-hw {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            min-height: 86px;
            padding: 8px 2px;
        }

        .btn-hw.solo {
            background: #101214;
        }

        .btn-hw.solo.on {
            background: var(--solo);
            color: #111;
            border-color: #ffe36d;
            box-shadow: 0 0 16px rgba(240, 195, 60, 0.58);
        }

        .btn-hw.on-btn.on {
            background: var(--on);
            border-color: #80f0b5;
            color: #06140d;
            box-shadow: 0 0 16px rgba(31, 185, 107, 0.5);
        }

        .btn-hw.on-btn.off {
            background: #050505;
            color: #d6d6d6;
            border-color: #333a40;
        }

        .btn-hw.disabled {
            opacity: 0.45;
        }

        .strip-grid {
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 8px;
            overflow: hidden;
        }

        .strip {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            padding: 9px 6px;
            background: var(--panel);
            border: 1px solid #2c3237;
            border-radius: 6px;
        }

        .strip .btn-hw {
            flex: 0 0 var(--strip-button-height);
            font-size: clamp(9px, 0.95vw, 12px);
            padding: 4px 2px;
        }

        .fader-box {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 0;
        }

        .channel-meter-fader-box {
            padding: 4px 0;
        }

        .channel-meter-fader-shell {
            position: relative;
            width: clamp(42px, 4.6vw, 58px);
            height: 82%;
            min-height: 92px;
            max-height: 100%;
        }

        .channel-fader-meter {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: clamp(18px, 2.1vw, 26px);
            transform: translateX(-50%);
            overflow: hidden;
            border: 1px solid #4a535c;
            border-radius: 6px;
            background: #0b0d0f;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
            pointer-events: none;
        }

        .channel-fader-meter-fill {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 0%;
            background: linear-gradient(to top, #145c2d 0%, #1fb96b 62%, #d6aa21 80%, #d06618 92%, #d93030 100%);
            transition: height 0.08s linear;
        }

        .channel-fader-meter-hold {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0%;
            height: 2px;
            background: #f2f2f2;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.65);
        }

        input[type="range"].v-fader {
            writing-mode: vertical-lr;
            direction: rtl;
            -webkit-appearance: none;
            appearance: none;
            width: clamp(42px, 4.6vw, 58px);
            height: 82%;
            min-height: 92px;
            max-height: 100%;
            accent-color: #d8d8d8;
            background: transparent;
            touch-action: none;
        }

        input[type="range"].v-fader::-webkit-slider-runnable-track {
            width: 8px;
            height: 100%;
            border-radius: 999px;
            background: #3d4247;
            border: 1px solid #5c646c;
        }

        input[type="range"].v-fader::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: clamp(28px, 3.4vw, 42px);
            height: clamp(28px, 3.4vw, 42px);
            margin-left: calc((8px - clamp(28px, 3.4vw, 42px)) / 2);
            border: 2px solid #f1f1f1;
            background: #d8d8d8;
            border-radius: 50%;
        }

        input[type="range"].v-fader.meter-fader {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            min-height: 0;
            z-index: 2;
        }

        input[type="range"].v-fader.meter-fader::-webkit-slider-runnable-track {
            background: transparent;
            border-color: transparent;
        }

        input[type="range"].v-fader.meter-fader::-webkit-slider-thumb {
            width: clamp(24px, 2.8vw, 34px);
            height: clamp(24px, 2.8vw, 34px);
            margin-left: 18px;
            border: 0;
            background: #d8d8d8;
            border-radius: 0;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
            box-shadow: -2px 0 8px rgba(0,0,0,0.45);
        }

        input[type="range"].v-fader::-moz-range-track {
            width: 8px;
            height: 100%;
            border-radius: 999px;
            background: #3d4247;
            border: 1px solid #5c646c;
        }

        input[type="range"].v-fader::-moz-range-thumb {
            width: clamp(28px, 3.4vw, 42px);
            height: clamp(28px, 3.4vw, 42px);
            border: 2px solid #f1f1f1;
            background: #d8d8d8;
            border-radius: 50%;
        }

        input[type="range"].v-fader.meter-fader::-moz-range-track {
            background: transparent;
            border-color: transparent;
        }

        input[type="range"].v-fader.meter-fader::-moz-range-thumb {
            width: clamp(24px, 2.8vw, 34px);
            height: clamp(24px, 2.8vw, 34px);
            border: 0;
            background: #d8d8d8;
            border-radius: 0;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
            box-shadow: -2px 0 8px rgba(0,0,0,0.45);
        }

        .master input[type="range"].v-fader {
            accent-color: #d93030;
        }

        .master input[type="range"].v-fader::-webkit-slider-thumb {
            background: #d93030;
            border-color: #ff7474;
        }

        .master input[type="range"].v-fader::-moz-range-thumb {
            background: #d93030;
            border-color: #ff7474;
        }

        .master-title {
            display: none;
        }

        .master .fader-box {
            flex: 1 1 auto;
        }

        .master .solo,
        .master .on-btn {
            flex: 0 0 var(--strip-button-height);
            font-size: clamp(9px, 0.95vw, 12px);
            padding: 4px 2px;
        }

        .strip-page {
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: transparent;
            border: 0;
        }

        .strip-header {
            display: none;
        }

        .strip-title {
            text-align: center;
            font-size: clamp(18px, 2.6vw, 30px);
            font-weight: 800;
        }

        .placeholder {
            flex: 1 1 auto;
            min-height: 0;
            padding: 18px;
            color: var(--muted);
            font-size: clamp(15px, 2vw, 22px);
        }

        .strip-body {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
            padding: 6px 4px 8px;
        }

        .strip-section {
            min-height: 0;
            display: grid;
            gap: 10px;
        }

        .eq-section {
            grid-template-columns: 1fr 1fr 1.45fr 1fr;
        }

        .utility-section {
            grid-template-columns: 1fr 1fr 1.15fr 1.15fr;
        }

        .control-cell {
            min-width: 0;
            min-height: 0;
            border: 0;
            background: #1d2227;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px;
            border-radius: 7px;
        }

        .control-cell.phase-hpf {
            justify-content: space-between;
        }

        .mid-cell {
            gap: 10px;
        }

        .control-label {
            color: var(--muted);
            font-size: clamp(10px, 1.15vw, 13px);
            font-weight: 800;
        }

        .knob {
            width: clamp(58px, 8vw, 96px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid #747474;
            background: radial-gradient(circle at 50% 50%, #303030 0 48%, #171717 50% 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: clamp(12px, 1.4vw, 16px);
            font-weight: 800;
            touch-action: none;
            user-select: none;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.08), 0 5px 14px rgba(0,0,0,0.25);
        }

        .knob::before {
            content: "";
            position: absolute;
            width: 4px;
            height: 32%;
            top: 8%;
            left: calc(50% - 2px);
            background: #d8d8d8;
            border-radius: 3px;
            transform: rotate(var(--angle, 0deg));
            transform-origin: 50% 130%;
        }

        .knob.disabled {
            opacity: 0.38;
            filter: grayscale(1);
            pointer-events: none;
        }

        .button-stack {
            width: 100%;
            display: grid;
            gap: 5px;
        }

        .pan-stereo-stack {
            width: 100%;
            display: grid;
            gap: 6px;
            justify-items: center;
        }

        .pan-stereo-top {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .hpf-stack {
            width: 100%;
            display: grid;
            gap: 6px;
        }

        .hpf-pair {
            display: grid;
            gap: 5px;
        }

        .mini-row {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(92px, 52%);
            justify-content: center;
            gap: 5px;
            align-items: center;
        }

        .mini-row.ratio-row {
            grid-template-columns: minmax(104px, 62%);
        }

        .mini-row.notch-row {
            grid-template-columns: minmax(104px, 62%);
        }

        .mini-row.comp-preset-row {
            grid-template-columns: minmax(108px, 58%);
        }

        .value-box {
            min-height: 36px;
            border: 1px solid #3c444b;
            background: #0b0d0f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            border-radius: 5px;
            white-space: nowrap;
            font-size: clamp(11px, 1.25vw, 15px);
        }

        .swipe-value {
            min-height: clamp(44px, 6.2vh, 54px);
            padding: 6px 10px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        [data-aux-notch-gain] {
            touch-action: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .strip-nav {
            flex: 0 0 clamp(58px, 8vh, 78px);
            display: grid;
            grid-template-columns: minmax(84px, 0.8fr) minmax(0, 2.6fr) minmax(84px, 0.8fr);
            gap: 8px;
            padding: 8px;
            background: var(--panel-dark);
            border-top: 1px solid var(--line);
        }

        .channel-row.strip-nav-row {
            grid-template-columns: minmax(84px, 0.75fr) minmax(0, 2.7fr) minmax(84px, 0.75fr);
        }

        .strip-channel-name {
            display: grid;
            grid-template-columns: auto minmax(80px, max-content);
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 0;
            background: #171b1f;
            border: 1px solid #303840;
            border-radius: 6px;
            font-weight: 900;
            font-size: clamp(14px, 2vw, 22px);
            padding: 0 10px;
        }

        .strip-channel-name span {
            flex: 0 0 auto;
        }

        .strip-channel-name input {
            width: min(42vw, 360px);
            min-width: 80px;
            height: 38px;
            background: transparent;
            color: var(--text);
            border: 0;
            outline: 0;
            font: inherit;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
        }

        .strip-page-nav {
            flex: 0 0 clamp(56px, 7.8vh, 74px);
            display: grid;
            grid-template-columns: minmax(84px, 0.75fr) minmax(0, 2.7fr) minmax(84px, 0.75fr);
            gap: 8px;
            padding: 6px 4px 2px;
        }

        .send-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
        }

        .send-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
            align-items: center;
        }

        .send-row .swipe-value {
            min-height: clamp(34px, 4.6vh, 42px);
            padding: 4px 8px;
        }

        .master-eq-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .master-comp-grid {
            grid-template-columns: 0.8fr 1fr 1fr 1.2fr;
        }

        .master-comp-preset-grid {
            grid-template-columns: minmax(150px, 220px);
            justify-content: start;
        }

        .effect-selector-grid {
            grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1fr);
        }

        .empty-module-slot {
            min-height: 0;
            border: 1px dashed rgba(80, 90, 100, 0.24);
            border-radius: 6px;
            background: rgba(8, 10, 12, 0.28);
        }

        .effect-preset-cell {
            align-items: stretch;
        }

        .effect-preset-grid {
            width: 100%;
            min-height: 0;
            display: grid;
            grid-template-rows: repeat(4, minmax(0, 1fr));
            grid-auto-flow: column;
            grid-auto-columns: minmax(0, 1fr);
            gap: 8px;
        }

        .scene-layout {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(150px, 0.9fr) minmax(0, 2.1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 10px;
            padding: 10px;
        }

        .scene-panel {
            min-height: 0;
            border: 0;
            background: #1d2227;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            border-radius: 7px;
        }

        .scene-list,
        .label-list {
            min-height: 0;
            overflow: hidden;
            display: grid;
            gap: 5px;
        }

        .scene-list {
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: none;
        }

        .label-list {
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: none;
        }

        .scene-list::-webkit-scrollbar,
        .label-list::-webkit-scrollbar {
            display: none;
        }

        .label-row {
            display: grid;
            grid-template-columns: 76px 1fr;
            gap: 6px;
            align-items: center;
        }

        .label-row input {
            min-width: 0;
            height: 34px;
            background: #080808;
            color: var(--text);
            border: 1px solid #555;
            padding: 4px 8px;
            font-weight: 700;
            border-radius: 4px;
        }

        .scene-name-input {
            width: 100%;
            min-height: 42px;
            background: #272c31;
            color: var(--text);
            border: 1px solid #3d444b;
            border-radius: 5px;
            padding: 6px 8px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
        }

        .scene-name-input.active {
            background: var(--active);
            border-color: #6cb5ff;
            box-shadow: 0 0 12px rgba(31, 122, 203, 0.38);
        }

        .scene-name-input.warning {
            background: #b7272d;
            border-color: #ff6b70;
            color: #fff;
        }

        .scene-name-input.undo {
            background: #1d7f42;
            border-color: #43d17b;
            color: #fff;
        }

        .scene-actions {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .btn-hw.copy-source {
            background: #d6aa21;
            color: #141006;
            border-color: #ffe06a;
            box-shadow: 0 0 14px rgba(214, 170, 33, 0.45);
        }

        .btn-hw.copy-target {
            background: #b7272d;
            color: #fff;
            border-color: #ff6a70;
            box-shadow: 0 0 14px rgba(183, 39, 45, 0.45);
        }

        .btn-hw.copy-done {
            background: #1fb96b;
            color: #06140d;
            border-color: #80f0b5;
            box-shadow: 0 0 16px rgba(31, 185, 107, 0.5);
        }

        .btn-hw.linked {
            border-color: #7edcff;
            box-shadow: inset 0 0 0 2px rgba(126, 220, 255, 0.45), 0 0 14px rgba(58, 180, 255, 0.38);
        }

        .master-select {
            flex: 0 0 var(--channel-select-button-height);
            font-size: clamp(11px, 1.3vw, 14px);
            min-height: 0;
            aspect-ratio: auto;
        }

        .page-tabs {
            flex: 0 0 clamp(46px, 6.8vh, 58px);
            display: grid;
            gap: 8px;
            padding: 4px;
        }

        .page-tabs.two {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .send-row.disabled {
            opacity: 0.34;
            filter: grayscale(1);
        }

        .send-row.disabled .btn-hw {
            pointer-events: none;
        }

        .control-cell.disabled {
            opacity: 0.34;
            filter: grayscale(1);
        }

        .meter-page {
            height: 100%;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) minmax(128px, 32%);
            gap: 10px;
            padding: 6px 4px 8px;
        }

        .meter-header {
            display: block;
        }

        .meter-title {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            padding: 7px 10px;
            background: #1d2227;
            border-radius: 7px;
            border: 1px solid #2c3237;
        }

        .meter-title strong {
            font-size: clamp(15px, 2vw, 22px);
            font-weight: 900;
        }

        .meter-title span {
            color: var(--muted);
            font-size: clamp(10px, 1.15vw, 13px);
            font-weight: 700;
        }

        .meter-grid {
            min-height: 0;
            display: grid;
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .meter-channel {
            min-height: 0;
            display: grid;
            grid-template-rows: auto minmax(42px, 1fr) 24px;
            gap: 6px;
            padding: 10px;
            background: #1d2227;
            border: 1px solid #2c3237;
            border-radius: 7px;
        }

        .meter-channel.inactive {
            opacity: 0.34;
            filter: grayscale(1);
        }

        .meter-label-row,
        .meter-numbers {
            display: flex;
            gap: 10px;
            align-items: baseline;
            justify-content: space-between;
            min-width: 0;
        }

        .meter-label {
            font-size: clamp(16px, 2.2vw, 26px);
            font-weight: 900;
        }

        .meter-numbers {
            justify-content: flex-end;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: clamp(10px, 1.25vw, 14px);
            font-weight: 700;
        }

        .meter-wrap {
            position: relative;
            min-height: 42px;
            overflow: hidden;
            border: 1px solid #3b4249;
            border-radius: 6px;
            background: #0b0d0f;
        }

        .meter-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #145c2d 0%, #1fb96b 62%, #d6aa21 80%, #d06618 92%, #d93030 100%);
            transition: width 0.08s linear;
        }

        .meter-hold-line {
            position: absolute;
            top: 0;
            left: 0%;
            width: 3px;
            height: 100%;
            background: #f2f2f2;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.55);
        }

        .meter-scale {
            position: relative;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
        }

        .meter-tick {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            text-align: center;
        }

        .meter-tick::before {
            content: "";
            display: block;
            width: 1px;
            height: 7px;
            margin: 0 auto 2px;
            background: #687078;
        }

        .spectrum-panel {
            min-height: 0;
            position: relative;
            min-width: 0;
            padding: 10px;
            background: #1d2227;
            border: 1px solid #2c3237;
            border-radius: 7px;
        }

        .spectrum-canvas {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 1px solid #3b4249;
            border-radius: 6px;
            background: #0b0d0f;
        }

        @media (max-height: 560px) {
            .strip,
            .master,
            .work-area {
                padding: 5px;
                gap: 5px;
            }

            .btn-hw {
                min-height: 32px;
                padding: 4px 6px;
            }

            input[type="range"].v-fader {
                min-height: 86px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="top-bar" id="topBar"></div>
        <div class="main">
            <aside class="bank-bar" id="bankBar"></aside>
            <section class="center">
                <main class="work-area" id="workArea"></main>
                <nav class="channel-row" id="channelRow"></nav>
            </section>
            <aside class="master" id="masterStrip"></aside>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();

        var modes = ["MIX", "AUX1", "AUX2", "AUX3", "AUX4", "EFF1", "EFF2", "MIX"];
        var modeIds = ["MIX", "AUX1", "AUX2", "AUX3", "AUX4", "EFF1", "EFF2", "MIX"];
        var banks = [
            {
                id: "1-8",
                label: "CH1-8",
                channels: [
                    { id: "1", midiKey: "1", label: "CH1", selectKey: 1, soloKey: 1 },
                    { id: "2", midiKey: "2", label: "CH2", selectKey: 2, soloKey: 2 },
                    { id: "3", midiKey: "3", label: "CH3", selectKey: 3, soloKey: 3 },
                    { id: "4", midiKey: "4", label: "CH4", selectKey: 4, soloKey: 4 },
                    { id: "5", midiKey: "5", label: "CH5", selectKey: 5, soloKey: 5 },
                    { id: "6", midiKey: "6", label: "CH6", selectKey: 6, soloKey: 6 },
                    { id: "7", midiKey: "7", label: "CH7", selectKey: 7, soloKey: 7 },
                    { id: "8", midiKey: "8", label: "CH8", selectKey: 8, soloKey: 8 }
                ]
            },
            {
                id: "9-16",
                label: "CH9-16",
                channels: [
                    { id: "9", midiKey: "9", label: "CH9", selectKey: 9, soloKey: 9 },
                    { id: "10", midiKey: "10", label: "CH10", selectKey: 10, soloKey: 10 },
                    { id: "11", midiKey: "11", label: "CH11", selectKey: 11, soloKey: 11 },
                    { id: "12", midiKey: "12", label: "CH12", selectKey: 12, soloKey: 12 },
                    { id: "13_14", midiKey: "13_14", label: "CH13/14", selectKey: "CH13_14", soloKey: "CH13_14" },
                    { id: "15_16", midiKey: "15_16", label: "CH15/16", selectKey: "CH15_16", soloKey: "CH15_16" },
                    { id: "RTN1", midiKey: "RTN1", label: "RTN1", selectKey: "RTN1", soloKey: "RTN1" },
                    { id: "RTN2", midiKey: "RTN2", label: "RTN2", selectKey: "RTN2", soloKey: "RTN2" }
                ]
            },
            {
                id: "17-24",
                label: "CH17-24",
                disabled: true,
                channels: []
            },
            {
                id: "scenes",
                label: "SCENES",
                page: "scenes",
                channels: []
            },
            {
                id: "meter",
                label: "METER",
                page: "meter",
                channels: []
            },
            {
                id: "copy",
                label: "COPY",
                page: "copy",
                channels: []
            }
        ];

        var state = {
            mode: "MIX",
            bankId: "1-8",
            view: "mixer",
            selectedId: null,
            selectedLabel: null,
            faders: {},
            on: {},
            solo: {},
            master: {},
            masterOn: {},
            masterSolo: {},
            activeMasterSoloTarget: null,
            masterEq: {},
            effectPreset: {},
            stripControls: {},
            stripPage: "eq",
            masterPage: {},
            selectedScene: "01",
            sceneDrafts: {},
            sceneSaved: {},
            sceneNameDrafts: {},
            sceneNames: {},
            mixSetups: {},
            loadedScene: "01",
            pendingConfirm: null,
            sceneResetUndo: null,
            previousViewBeforeScenes: null,
            previousViewBeforeMeter: null,
            audioMeter: {
                running: false,
                requesting: false,
                remoteRequesting: false,
                requestToken: 0,
                status: "READY",
                stream: null,
                context: null,
                source: null,
                processor: null,
                fftSize: 2048,
                sampleRate: 44100,
                channelLeftIndex: 0,
                channelRightIndex: 1,
                channelLabel: "1-2",
                spectrumSmoothed: [],
                leftPpm: null,
                rightPpm: null,
                leftPeakHold: -60,
                rightPeakHold: -60,
                leftPeakTime: 0,
                rightPeakTime: 0,
                integratedPower: 0,
                lufsBlocks: 0,
                data: {
                    left_rms: -60,
                    right_rms: -60,
                    left_ppm: -60,
                    right_ppm: -60,
                    left_peak: -60,
                    right_peak: -60,
                    left_peak_hold: -60,
                    right_peak_hold: -60,
                    momentary_lufs: -70,
                    integrated_lufs: -70,
                    spectrum: []
                }
            },
            copy: {
                phase: "idle",
                source: null,
                targets: [],
                undo: null
            },
            auxLinks: {
                "1-2": false,
                "3-4": false
            }
        };

        var midFreqPresets = [250, 500, 1000, 2000, 4000];
        var masterEqFreqPresets = {
            low: [60, 80, 100, 120],
            lowMid: [250, 400, 630, 1000],
            highMid: [1000, 2000, 4000, 6000],
            high: [8000, 10000, 12000]
        };
        var auxNotchGainPresets = [0, -3, -6, -9, -12, -15, -18];
        var stereoSpreadPresets = ["Stereo", "Wide", "Narrow", "Mono"];
        var stereoSpreadConfig = {
            Stereo: { left: -16, right: 16, panRange: [0, 0], panDisabled: true },
            Wide: { left: -10, right: 10, panRange: [-6, 6], panDisabled: false },
            Narrow: { left: -6, right: 6, panRange: [-10, 10], panDisabled: false },
            Mono: { left: 0, right: 0, panRange: [-16, 16], panDisabled: false }
        };
        var sceneIds = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15"];
        var ratioPresets = ["1:1", "1.1:1", "1.3:1", "1.5:1", "1.7:1", "2:1", "2.5:1", "3:1", "3.5:1", "4:1", "5:1", "6:1", "8:1", "10:1", "20:1", "INF"];
        var masterCompressorPresetSets = {
            master: [
                { id: "comp", label: "COMP" },
                { id: "glue", label: "GLUE" },
                { id: "limiter", label: "LIMITER" },
                { id: "clipper", label: "CLIPPER" }
            ],
            aux: [
                { id: "comp", label: "COMP" },
                { id: "shape", label: "VOCAL" },
                { id: "glue", label: "GLUE" },
                { id: "limiter", label: "LIMITER" }
            ]
        };
        var masterCompressorPresetDefaults = {
            comp: { threshold: -8, ratio: "2.5:1", outGain: 0 },
            shape: { threshold: -20, ratio: "2.5:1", outGain: 2 },
            glue: { threshold: -18, ratio: "3.5:1", outGain: 2.5 },
            limiter: { threshold: -9, ratio: "3:1", outGain: 0 },
            clipper: { threshold: 0, ratio: "INF", outGain: 0 }
        };
        var effectPresets = [
            { label: "HALL", commandId: "effect.preset.hall", effect1CommandId: "effect1.preset.hall" },
            { label: "ROOM", commandId: "effect.preset.room", effect1CommandId: "effect1.preset.room" },
            { label: "STAGE", commandId: "effect.preset.stage", effect1CommandId: "effect1.preset.stage" },
            { label: "PLATE", commandId: "effect.preset.plate", effect1CommandId: "effect1.preset.plate" },
            { label: "ECHO", commandId: "effect.preset.echo", effect1CommandId: "effect1.preset.echo" },
            { label: "DELAY", commandId: "effect.preset.delay", effect1CommandId: "effect1.preset.delay" },
            { label: "CHORUS", commandId: "effect.preset.chorus", effect1CommandId: "effect1.preset.chorus" },
            { label: "SYMPHONIC", commandId: "effect.preset.symphonic", effect1CommandId: "effect1.preset.symphonic" }
        ];
        var compressorPresets = ["OFF", "COMP", "KICK", "SNARE", "BASS", "FUNKY", "GUITAR", "VOCAL", "GLUE"];
        var suppressStripClick = false;
        var lastTopModeTap = { mode: null, time: 0 };
        var lastSceneButtonTap = { scene: null, time: 0 };
        var lastMeterButtonTap = { key: null, time: 0 };
        var copyTimer = null;

        var masterByMode = {
            MIX: { id: "stereo", label: "ST MASTER", parameter: "masterFader.stereo" },
            AUX1: { id: "aux1", label: "AUX1 MASTER", parameter: "masterFader.aux1" },
            AUX2: { id: "aux2", label: "AUX2 MASTER", parameter: "masterFader.aux2" },
            AUX3: { id: "aux3", label: "AUX3 MASTER", parameter: "masterFader.aux3" },
            AUX4: { id: "aux4", label: "AUX4 MASTER", parameter: "masterFader.aux4" },
            EFF1: { id: "effect1", label: "EFF1 MASTER", parameter: "masterFader.effect2" },
            EFF2: { id: "effect2", label: "EFF2 MASTER", parameter: "masterFader.effect1" }
        };
        var masterSoloTargetIds = ["stereo", "aux1", "aux2", "aux3", "aux4", "effect1", "effect2"];

        var faderGroupByMode = {
            MIX: "channelFader",
            AUX1: "auxSend.AUX1",
            AUX2: "auxSend.AUX2",
            AUX3: "auxSend.AUX3",
            AUX4: "auxSend.AUX4",
            EFF1: "fx2Send",
            EFF2: "fx1Send"
        };

        function sendAction(action) {
            socket.emit("midi action", action);
        }

        function sendParameter(parameterId, value) {
            if (!parameterId) return;
            sendAction({ type: "sendParameter", parameterId: parameterId, value: value });
        }

        function sendParameterCc(parameterId, value) {
            if (!parameterId) return;
            sendAction({ type: "sendParameterCc", parameterId: parameterId, value: value });
        }

        function setChannelOn(channel, enabled) {
            if (!channel) return;
            sendAction({ type: "setChannelOn", channel: channel, enabled: enabled });
        }

        function setChannelSolo(channel, enabled) {
            if (!channel) return;
            sendAction({ type: "setChannelSolo", channel: channel, enabled: enabled });
        }

        function setChannelPhase(channel, enabled) {
            if (!channel) return;
            sendAction({ type: "setChannelPhase", channel: channel, enabled: enabled });
        }

        function setMasterOn(master, enabled) {
            sendAction({ type: "setMasterOn", master: master, enabled: enabled });
        }

        function setMasterOnCc(master, enabled) {
            sendAction({ type: "setMasterOnCc", master: master, enabled: enabled });
        }

        function setMasterSolo(master, enabled) {
            sendAction({ type: "setMasterSolo", master: master, enabled: enabled });
        }

        function setMasterSoloRoute(target) {
            var normalized = target || null;
            if (state.activeMasterSoloTarget === normalized) return;
            state.activeMasterSoloTarget = normalized;
            setMasterSolo(normalized || "__all__", !!normalized);
        }

        function isMeterDelegationMode() {
            return state.view === "meter";
        }

        function isMeterDoubleTap(key) {
            var now = Date.now();
            var isDouble = lastMeterButtonTap.key === key && now - lastMeterButtonTap.time < 430;
            lastMeterButtonTap = isDouble ? { key: null, time: 0 } : { key: key, time: now };
            return isDouble;
        }

        function exitMeterMode() {
            state.view = "mixer";
            state.previousViewBeforeMeter = null;
        }

        function isAudioMeterSourceClient() {
            var params = new URLSearchParams(window.location.search || "");
            if (params.get("meterSource") === "1") return true;
            if (params.get("meterSource") === "0") return false;
            var host = window.location.hostname;
            return host === "localhost" || host === "127.0.0.1" || host === "::1";
        }

        function eqGainDbToByte(value) {
            var gain = Math.max(-18, Math.min(18, parseFloat(value) || 0));
            return Math.round((gain + 18) * 2);
        }

        function sendEqParameter(channel, band, parameter, value) {
            if (!eqSupportedChannel(channel)) return;
            sendAction({
                type: "writeEqParameter",
                channel: channel.midiKey,
                band: band,
                parameter: parameter,
                value: value
            });
        }

        function eqSupportedChannel(channel) {
            if (!channel) return false;
            if (channel.midiKey === "13_14" || channel.midiKey === "15_16") return true;
            if (!/^\d+$/.test(channel.midiKey)) return false;
            var number = parseInt(channel.midiKey, 10);
            return number >= 1 && number <= 12;
        }

        function sendEqControl(channel, control, value) {
            if (!eqSupportedChannel(channel)) return;
            var controls = channelControls(channel);
            sendAction({
                type: "engineEqIntent",
                channel: channel.midiKey,
                control: control,
                value: value,
                state: {
                    midFrequency: midFreqPresets[controls.midFreqIndex],
                    midGain: controls.midGain,
                    hpf: controls.hpf
                }
            });
        }

        function sendChannelEqBundle(channel) {
            if (!eqSupportedChannel(channel)) return;
            var controls = channelControls(channel);
            sendEqControl(channel, "hpf", controls.hpf);
            sendEqControl(channel, "lowGain", controls.lowGain);
            sendEqControl(channel, "midGain", controls.midGain);
            sendEqControl(channel, "highGain", controls.highGain);
        }

        function sendCompressorControl(channel, presetName, controls) {
            if (!channel) return;
            sendAction({
                type: "engineCompressorIntent",
                target: {
                    type: "channel",
                    id: channel.id,
                    midiKey: channel.midiKey
                },
                presetId: presetName,
                amount: controls.compPosition,
                state: {
                    presetIndex: controls.compPresetIndex,
                    potPosition: controls.compPosition
                }
            });
        }

        function sendMasterCompressorControl(master) {
            if (!master) return;
            var controls = masterEqControls(master);
            sendAction({
                type: "engineMasterCompressorIntent",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    mode: state.mode
                },
                state: {
                    compStyle: controls.compStyle,
                    threshold: controls.threshold,
                    ratioIndex: controls.ratioIndex,
                    outGain: controls.outGain
                }
            });
        }

        function masterCompressorCommandTarget(master) {
            if (!master || master.id === "stereo") return "master";
            return master.id;
        }

        function sendMasterCompressorPreset(master, presetId) {
            if (!master || !presetId) return;
            sendAction({
                type: "sendCommand",
                commandId: "dynamicsPreset." + masterCompressorCommandTarget(master) + "." + presetId
            });
        }

        function sendMasterCompressorOn(master, enabled) {
            if (!master) return;
            sendAction({
                type: "writeDynamicsBundle",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    mode: state.mode
                },
                values: {
                    on: !!enabled
                }
            });
        }

        function sendMasterCompressorParameter(master, control, value) {
            if (!master) return;
            var values = { on: true };
            if (control === "threshold") values.threshold = value;
            if (control === "ratioIndex") values.ratio = ratioPresets[value] || ratioPresets[0];
            if (control === "outGain") values.outGain = value;
            sendAction({
                type: "writeDynamicsBundle",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    mode: state.mode
                },
                values: values
            });
        }

        function applyMasterCompressorPresetDefaults(master, presetId) {
            var defaults = masterCompressorPresetDefaults[presetId];
            if (!master || !defaults) return;
            var controls = masterEqControls(master);
            controls.threshold = defaults.threshold;
            controls.ratioIndex = Math.max(0, ratioPresets.indexOf(defaults.ratio));
            controls.outGain = defaults.outGain;
            controls.compOn = true;
            sendAction({
                type: "writeDynamicsBundle",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    mode: state.mode
                },
                values: {
                    on: true,
                    threshold: defaults.threshold,
                    ratio: defaults.ratio,
                    outGain: defaults.outGain
                }
            });
        }

        function masterEqTargetKey(master) {
            if (!master || master.id === "stereo") return "STEREO";
            return master.id.toUpperCase();
        }

        function sendMasterEqControl(master, control, value) {
            if (!master || master.id !== "stereo") return;
            var controls = masterEqControls(master);
            sendAction({
                type: "engineMasterEqIntent",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    targetKey: masterEqTargetKey(master),
                    mode: state.mode
                },
                control: control,
                value: value,
                state: {
                    low: controls.low,
                    lowFrequency: masterEqFreqPresets.low[controls.lowFreqIndex],
                    lowMid: controls.lowMid,
                    lowMidFrequency: masterEqFreqPresets.lowMid[controls.lowMidFreqIndex],
                    highMid: controls.highMid,
                    highMidFrequency: masterEqFreqPresets.highMid[controls.highMidFreqIndex],
                    high: controls.high,
                    highFrequency: masterEqFreqPresets.high[controls.highFreqIndex]
                }
            });
        }

        function sendAuxEqControl(master, control, value) {
            if (!master || master.id.indexOf("aux") !== 0) return;
            var controls = masterEqControls(master);
            sendAction({
                type: "engineAuxEqIntent",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    targetKey: masterEqTargetKey(master),
                    mode: state.mode
                },
                control: control,
                value: value,
                state: {
                    hpf: controls.auxHpf,
                    lowNotchFreq: controls.auxNotch1Freq,
                    lowNotchGain: auxNotchGainPresets[controls.auxNotch1GainIndex],
                    lowNotchInit: controls.auxNotch1Init,
                    highNotchFreq: controls.auxNotch2Freq,
                    highNotchGain: auxNotchGainPresets[controls.auxNotch2GainIndex],
                    highNotchInit: controls.auxNotch2Init,
                    presence: controls.auxPresence
                }
            });
        }

        function effectReturnTarget(channel) {
            if (!channel) return null;
            if (channel.id === "RTN1") return "RTN1";
            if (channel.id === "RTN2") return "RTN2";
            return null;
        }

        function sendEffectReturnEqControl(channel, control, value) {
            var targetKey = effectReturnTarget(channel);
            if (!targetKey) return;
            var controls = channelControls(channel);
            sendAction({
                type: "engineEffectReturnEqIntent",
                target: {
                    type: "return",
                    id: channel.id,
                    midiKey: targetKey,
                    targetKey: targetKey
                },
                control: control,
                value: value,
                state: {
                    hpf: controls.effectReturnHpf,
                    low: controls.effectReturnLow,
                    mid: controls.effectReturnMid,
                    air: controls.effectReturnAir
                }
            });
        }

        function sendAllChannelControls(channel) {
            var controls = channelControls(channel);
            if (channel.midiKey) {
                if (state.faders[channel.id] !== undefined) sendParameter("channelFader." + channel.midiKey, state.faders[channel.id]);
                sendParameterForSend(channel, "aux1", controls.aux1);
                sendParameterForSend(channel, "aux2", controls.aux2);
                sendParameterForSend(channel, "aux3", controls.aux3);
                sendParameterForSend(channel, "aux4", controls.aux4);
                sendParameterForSend(channel, "eff1", controls.eff1);
                sendParameterForSend(channel, "eff2", controls.eff2);
            }
            sendPanControl(channel, controls.pan);
            sendStereoSpreadControl(channel, controls.stereoSpreadMode, controls.stereoPan);
            sendEqControl(channel, "hpf", controls.hpf);
            sendEqControl(channel, "lowGain", controls.lowGain);
            sendEqControl(channel, "midFrequency", midFreqPresets[controls.midFreqIndex]);
            sendEqControl(channel, "midGain", controls.midGain);
            sendEqControl(channel, "highGain", controls.highGain);
            var presetName = compressorPresets[controls.compPresetIndex] || compressorPresets[0];
            if (channel.id !== "RTN1" && channel.id !== "RTN2") sendCompressorControl(channel, presetName, controls);
        }

        function sendPanControl(channel, value) {
            if (!channel) return;
            if (isStereoWidthSource(channel)) {
                sendStereoSpreadControl(channel, channelControls(channel).stereoSpreadMode, channelControls(channel).stereoPan);
                return;
            }
            if (channel.id === "RTN1" || channel.id === "RTN2") {
                var keys = stereoPanKeys(channel);
                var pairedValue = Math.round(((parseInt(value, 10) + 16) / 32) * 32);
                sendParameter("pan." + keys[0], pairedValue);
                sendParameter("pan." + keys[1], pairedValue);
                return;
            }
            var midiValue = Math.round(((parseInt(value, 10) + 16) / 32) * 127);
            sendParameter("pan." + channel.midiKey, midiValue);
        }

        function stereoPanKeys(channel) {
            if (!channel) return null;
            if (channel.id === "13_14") return ["CH13_L", "CH13_R"];
            if (channel.id === "15_16") return ["CH15_L", "CH15_R"];
            if (channel.id === "RTN1") return ["RTN1_L", "RTN1_R"];
            if (channel.id === "RTN2") return ["RTN2_L", "RTN2_R"];
            return null;
        }

        function phaseCapable(channel) {
            return !!channel && channel.id !== "RTN1" && channel.id !== "RTN2";
        }

        function isStereoWidthSource(channel) {
            return !!channel && (channel.id === "13_14" || channel.id === "15_16" || channel.id === "RTN1" || channel.id === "RTN2");
        }

        function sendStereoSpreadControl(channel, mode, pan) {
            var keys = stereoPanKeys(channel);
            if (!keys || !isStereoWidthSource(channel)) return;
            var config = stereoSpreadConfig[mode] || stereoSpreadConfig.Stereo;
            var panRange = config.panRange || [0, 0];
            var panValue = config.panDisabled ? 0 : Math.max(panRange[0], Math.min(panRange[1], parseInt(pan, 10) || 0));
            sendParameter("pan." + keys[0], config.left + panValue + 16);
            sendParameter("pan." + keys[1], config.right + panValue + 16);
            if (channel.id === "13_14") sendParameter("attenuator.CH13_14.left", 0x60);
            if (channel.id === "15_16") sendParameter("attenuator.CH15_16.left", 0x60);
        }

        function activeBank() {
            var bank = banks.find(function(bank) { return bank.id === state.bankId; }) || banks[0];
            if (bank.disabled || bank.page) return banks[0];
            return bank;
        }

        function currentChannels() {
            return activeBank().channels;
        }

        function allChannels() {
            var all = [];

                if (!bank.disabled && !bank.page) all = all.concat(bank.channels);

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function(char) {
                return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[char];

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));

        function dbToPercent(db, minDb, maxDb) {
            var value = clamp(parseFloat(db) || minDb, minDb, maxDb);
            return ((value - minDb) / (maxDb - minDb)) * 100;

        function dbfs(value) {
            return Math.max(-60, 20 * Math.log10(Math.max(value, 1e-12)));

        function lufsFromPower(power) {

        function createBallisticMeter(attackMs, releaseMs, rateHz) {
            function coeff(ms) {

            return {
                value: -60,
                attackCoeff: coeff(attackMs),
                releaseCoeff: coeff(releaseMs),
                process: function(targetDb) {
                    var selectedCoeff = targetDb > this.value ? this.attackCoeff : this.releaseCoeff;
                    this.value = (selectedCoeff * this.value) + ((1 - selectedCoeff) * targetDb);
                    return this.value;
                }
            };
        }

        function resetAudioMeterData() {
            var meter = state.audioMeter;
            meter.leftPpm = createBallisticMeter(10, 1500, 30);
            meter.rightPpm = createBallisticMeter(10, 1500, 30);
            meter.leftPeakHold = -60;
            meter.rightPeakHold = -60;
            meter.leftPeakTime = 0;
            meter.rightPeakTime = 0;
            meter.integratedPower = 0;
            meter.lufsBlocks = 0;
            meter.spectrumSmoothed = [];
            meter.data = {
                left_rms: -60,
                right_rms: -60,
                left_ppm: -60,
                right_ppm: -60,
                left_peak: -60,
                right_peak: -60,
                left_peak_hold: -60,
                right_peak_hold: -60,

                integrated_lufs: -70,

        function roundDb(value) {

        function fftRadix2(real, imag) {
            var n = real.length;
            var j = 0;
            for (var i = 1; i < n; i++) {
                var bit = n >> 1;
                while (j & bit) {
                    j ^= bit;
                    bit >>= 1;
                }
                j ^= bit;
                if (i < j) {
                    var realTemp = real[i];
                    var imagTemp = imag[i];
                    real[i] = real[j];
                    imag[i] = imag[j];
                    real[j] = realTemp;
                    imag[j] = imagTemp;
                }
            }

            for (var len = 2; len <= n; len <<= 1) {
                var angle = -2 * Math.PI / len;
                var wLenReal = Math.cos(angle);
                var wLenImag = Math.sin(angle);
                for (var offset = 0; offset < n; offset += len) {
                    var wReal = 1;
                    var wImag = 0;
                    for (var k = 0; k < len / 2; k++) {
                        var evenIndex = offset + k;
                        var oddIndex = evenIndex + len / 2;
                        var oddReal = (real[oddIndex] * wReal) - (imag[oddIndex] * wImag);
                        var oddImag = (real[oddIndex] * wImag) + (imag[oddIndex] * wReal);
                        real[oddIndex] = real[evenIndex] - oddReal;
                        imag[oddIndex] = imag[evenIndex] - oddImag;
                        real[evenIndex] += oddReal;
                        imag[evenIndex] += oddImag;
                        var nextWReal = (wReal * wLenReal) - (wImag * wLenImag);
                        wImag = (wReal * wLenImag) + (wImag * wLenReal);
                        wReal = nextWReal;
                    }
                }
            }
        }

        function computeSpectrum(monoSamples, sampleRate) {
            var meter = state.audioMeter;
            var fftSize = meter.fftSize || 2048;
            var real = new Float32Array(fftSize);
            var imag = new Float32Array(fftSize);
            for (var i = 0; i < fftSize; i++) {
                var sample = i < monoSamples.length ? monoSamples[i] : 0;
                var windowValue = 0.5 - (0.5 * Math.cos((2 * Math.PI * i) / (fftSize - 1)));
                real[i] = sample * windowValue;
            }

            fftRadix2(real, imag);

            var bins = fftSize / 2;
            var spectrum = new Array(bins);
            for (var bin = 0; bin < bins; bin++) {
                var magnitude = Math.sqrt((real[bin] * real[bin]) + (imag[bin] * imag[bin])) / (fftSize / 2);
                var db = 20 * Math.log10(Math.max(magnitude, 1e-12));
                spectrum[bin] = roundDb(clamp(db, -90, 0));
            }
            meter.sampleRate = sampleRate || meter.sampleRate || 44100;
            return spectrum;
        }

        function updatePeakHold(peakDb, channel) {
            var meter = state.audioMeter;
            var now = Date.now() / 1000;
            var holdKey = channel + "PeakHold";
            var timeKey = channel + "PeakTime";
            if (peakDb >= meter[holdKey] || (now - meter[timeKey]) > 2) {
                meter[holdKey] = peakDb;
                meter[timeKey] = now;
            }
            return meter[holdKey];
        }

        function processAudioMeterFrame(input) {
            var meter = state.audioMeter;
            var leftSum = 0;
            var rightSum = 0;
            var leftPeak = 0;
            var rightPeak = 0;
            var right = input.length > 1 ? input[1] : input[0];
            var length = input[0].length;
            var mono = new Float32Array(length);
            for (var i = 0; i < length; i++) {
                var l = input[0][i] || 0;
                var r = right[i] || 0;
                mono[i] = (l + r) * 0.5;
                leftSum += l * l;
                rightSum += r * r;
                leftPeak = Math.max(leftPeak, Math.abs(l));
                rightPeak = Math.max(rightPeak, Math.abs(r));
            }

            var leftRmsDb = dbfs(Math.sqrt(leftSum / length));
            var rightRmsDb = dbfs(Math.sqrt(rightSum / length));
            var leftPeakDb = dbfs(leftPeak);
            var rightPeakDb = dbfs(rightPeak);
            var stereoPower = ((leftSum / length) + (rightSum / length)) / 2;
            meter.integratedPower += stereoPower;
            meter.lufsBlocks += 1;
            meter.data = {
                left_rms: roundDb(leftRmsDb),
                right_rms: roundDb(rightRmsDb),
                left_ppm: roundDb(meter.leftPpm.process(leftRmsDb)),
                right_ppm: roundDb(meter.rightPpm.process(rightRmsDb)),
                left_peak: roundDb(leftPeakDb),
                right_peak: roundDb(rightPeakDb),
                left_peak_hold: roundDb(updatePeakHold(leftPeakDb, "left")),
                right_peak_hold: roundDb(updatePeakHold(rightPeakDb, "right")),
                momentary_lufs: roundDb(lufsFromPower(stereoPower)),
                integrated_lufs: roundDb(lufsFromPower(meter.integratedPower / meter.lufsBlocks)),
                spectrum: computeSpectrum(mono, meter.context ? meter.context.sampleRate : meter.sampleRate)
            };
            socket.emit("audio meter frame", {
                data: meter.data,
                sampleRate: meter.sampleRate,
                status: meter.status
            });
            updateAudioMeterDom();
        }

        function applyAudioMeterFrame(payload) {
            if (!payload || !payload.data || isAudioMeterSourceClient()) return;
            var meter = state.audioMeter;
            meter.sampleRate = payload.sampleRate || meter.sampleRate || 44100;
            meter.status = payload.status || "RECEIVING HOST METER";
            meter.data = Object.assign({}, meter.data, payload.data);
            updateAudioMeterDom();
        }

        function handleAudioMeterRequest(payload) {
            if (!isAudioMeterSourceClient()) return;
            if (!payload || payload.active !== false) startAudioMeter();
        }

        function applyMeterConfig(config) {
            if (!config || !config.audioChannels) return;
            var audioChannels = config.audioChannels;
            state.audioMeter.channelLeftIndex = Math.max(0, parseInt(audioChannels.left, 10) || 0);
            state.audioMeter.channelRightIndex = Math.max(0, parseInt(audioChannels.right, 10) || state.audioMeter.channelLeftIndex);
            state.audioMeter.channelLabel = audioChannels.label || ((state.audioMeter.channelLeftIndex + 1) + "-" + (state.audioMeter.channelRightIndex + 1));
        }

        function updateAudioMeterDom() {
            var data = state.audioMeter.data;
            var meterContext = meterDisplayContext();
            var rightPpmValue = meterContext.stereo ? data.right_ppm : -60;
            var rightRmsValue = meterContext.stereo ? data.right_rms : -60;
            var rightPeakValue = meterContext.stereo ? data.right_peak : -60;
            var rightHoldValue = meterContext.stereo ? data.right_peak_hold : -60;
            var pairs = {
                leftPpm: data.left_ppm,
                rightPpm: rightPpmValue,
                leftRms: data.left_rms,
                rightRms: rightRmsValue,
                leftPeak: data.left_peak,
                rightPeak: rightPeakValue,
                leftHold: data.left_peak_hold,
                rightHold: rightHoldValue,

            };
            Object.keys(pairs).forEach(function(id) {

            });
            var leftBar = document.getElementById("leftBar");
            var rightBar = document.getElementById("rightBar");
            var leftHoldLine = document.getElementById("leftHoldLine");
            var rightHoldLine = document.getElementById("rightHoldLine");
            if (leftBar) leftBar.style.width = dbToPercent(data.left_ppm, -60, 0) + "%";
            if (rightBar) rightBar.style.width = dbToPercent(rightPpmValue, -60, 0) + "%";
            if (leftHoldLine) leftHoldLine.style.left = dbToPercent(data.left_peak_hold, -60, 0) + "%";
            if (rightHoldLine) rightHoldLine.style.left = dbToPercent(rightHoldValue, -60, 0) + "%";
            var rightChannel = document.getElementById("rightMeterChannel");
            if (rightChannel) rightChannel.classList.toggle("inactive", !meterContext.stereo);
            drawSpectrum();
            updateInlineMeterDom();
        }

        function drawSpectrum() {
            var canvas = document.getElementById("spectrumCanvas");
            if (!canvas) return;
            var data = state.audioMeter.data.spectrum || [];
            var meter = state.audioMeter;
            var rect = canvas.getBoundingClientRect();
            var width = Math.max(1, Math.floor(rect.width));
            var height = Math.max(1, Math.floor(rect.height));
            var ratio = window.devicePixelRatio || 1;
            if (canvas.width !== Math.floor(width * ratio) || canvas.height !== Math.floor(height * ratio)) {
                canvas.width = Math.floor(width * ratio);
                canvas.height = Math.floor(height * ratio);
            }

            var ctx = canvas.getContext("2d");
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#0b0d0f";
            ctx.fillRect(0, 0, width, height);

            var minDb = -90;
            var maxDb = 0;
            var minFreq = 30;
            var maxFreq = Math.min(meter.sampleRate / 2 || 20000, 20000);
            var logRange = Math.log(maxFreq / minFreq);
            var plotHeight = Math.max(20, height - 20);
            ctx.strokeStyle = "rgba(104, 112, 120, 0.32)";
            ctx.lineWidth = 1;
            [-90, -72, -54, -36, -18].forEach(function(db) {
                var y = plotHeight - (dbToPercent(db, minDb, maxDb) / 100 * plotHeight);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            });

            [50, 100, 1000, 5000, 10000].forEach(function(freq) {
                if (freq < minFreq || freq > maxFreq) return;
                var x = Math.log(freq / minFreq) / logRange * width;
                ctx.strokeStyle = "rgba(242, 242, 242, 0.18)";
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, plotHeight);
                ctx.stroke();
                ctx.fillStyle = "#aeb6bf";
                ctx.font = "700 10px Arial, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                var label = freq >= 1000 ? (freq / 1000) + " kHz" : freq + " Hz";
                ctx.fillText(label, clamp(x, 24, width - 24), height - 3);
            });

            if (!data.length) return;
            var smoothed = meter.spectrumSmoothed || [];
            for (var i = 0; i < data.length; i++) {
                var target = clamp(data[i], minDb, maxDb);
                var previous = typeof smoothed[i] === "number" ? smoothed[i] : minDb;
                smoothed[i] = target > previous ? (previous * 0.45) + (target * 0.55) : Math.max(target, previous - 1.8);
            }
            meter.spectrumSmoothed = smoothed;

            var barCount = clamp(Math.floor(width / 4), 56, 180);
            var barWidth = Math.max(2, width / barCount - 1);
            var gradient = ctx.createLinearGradient(0, plotHeight, 0, 0);
            gradient.addColorStop(0, "#145c2d");
            gradient.addColorStop(0.58, "#1fb96b");
            gradient.addColorStop(0.78, "#d6aa21");
            gradient.addColorStop(1, "#d93030");
            ctx.fillStyle = gradient;
            for (var bar = 0; bar < barCount; bar++) {
                var xNorm = barCount === 1 ? 0 : bar / (barCount - 1);
                var freq = minFreq * Math.pow(maxFreq / minFreq, xNorm);
                var bin = clamp(Math.round(freq / (meter.sampleRate / 2) * (data.length - 1)), 0, data.length - 1);
                var value = clamp(smoothed[bin], minDb, maxDb);
                var valuePercent = dbToPercent(value, minDb, maxDb) / 100;
                var barHeight = Math.max(1, valuePercent * plotHeight);
                var x = xNorm * (width - barWidth);
                ctx.fillRect(x, plotHeight - barHeight, barWidth, barHeight);
            }
        }

        function channelMeterLevel() {
            var data = state.audioMeter.data;
            return Math.max(data.left_ppm, data.right_ppm);
        }

        function channelMeterHoldLevel() {
            var data = state.audioMeter.data;
            return Math.max(data.left_peak_hold, data.right_peak_hold);
        }

        function updateInlineMeterDom() {

            var holdPercent = dbToPercent(channelMeterHoldLevel(), -60, 0);

        function hasChannelSolo() {

        function hasMasterSolo() {

        }

        function activeManualMasterSoloTarget() {
            for (var i = 0; i < masterSoloTargetIds.length; i++) {

            }

        function clearMasterSoloState(exceptId) {

        function isAutoMixMasterSolo(master) {

        }

        function isMasterMeterActive(master) {

        }

        function shouldAudioMeterRun() {
            return state.view === "meter" || hasChannelSolo() || hasMasterSolo() || isAutoMixMasterSolo(masterByMode[state.mode]);
        }

        function syncAudioMeterService() {
            if (shouldAudioMeterRun()) {
                startAudioMeter();
            } else if (state.audioMeter.running || state.audioMeter.requesting) {
                stopAudioMeter();
            }
        }

        function stopAudioMeter() {
            var meter = state.audioMeter;
            meter.requestToken += 1;
            if (meter.processor) meter.processor.disconnect();
            if (meter.source) meter.source.disconnect();
            if (meter.stream) {
                meter.stream.getTracks().forEach(function(track) { track.stop(); });
            }
            if (meter.context && meter.context.state !== "closed") meter.context.close();
            meter.processor = null;
            meter.source = null;
            meter.stream = null;
            meter.context = null;
            meter.running = false;
            meter.requesting = false;
            meter.remoteRequesting = false;
            meter.status = "STOPPED";
            updateAudioMeterDom();
        }

        function startAudioMeter() {
            if (state.audioMeter.running || state.audioMeter.requesting) return;
            if (!isAudioMeterSourceClient()) {
                state.audioMeter.status = "RECEIVING HOST METER";
                if (!state.audioMeter.remoteRequesting) {
                    state.audioMeter.remoteRequesting = true;
                    socket.emit("audio meter request", { active: true });
                }
                updateAudioMeterDom();
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                state.audioMeter.status = "NO AUDIO API";
                updateAudioMeterDom();
                return;
            }
            resetAudioMeterData();
            state.audioMeter.requesting = true;
            state.audioMeter.status = "REQUESTING INPUT";
            var requestToken = state.audioMeter.requestToken + 1;
            state.audioMeter.requestToken = requestToken;
            updateAudioMeterDom();
            navigator.mediaDevices.getUserMedia({
                audio: {
                    channelCount: { ideal: Math.max(2, state.audioMeter.channelRightIndex + 1) },
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: false

            }).then(function(stream) {
                var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                var context = new AudioContextClass();
                var source = context.createMediaStreamSource(stream);
                var processor = context.createScriptProcessor(state.audioMeter.fftSize, 2, 2);
                if (state.audioMeter.requestToken !== requestToken || !shouldAudioMeterRun()) {
                    stream.getTracks().forEach(function(track) { track.stop(); });
                    context.close();
                    return;
                }
                processor.onaudioprocess = function(event) {
                    var inputBuffer = event.inputBuffer;
                    var leftIndex = Math.min(state.audioMeter.channelLeftIndex, inputBuffer.numberOfChannels - 1);
                    var rightIndex = Math.min(state.audioMeter.channelRightIndex, inputBuffer.numberOfChannels - 1);
                    processAudioMeterFrame([
                        inputBuffer.getChannelData(leftIndex),
                        inputBuffer.getChannelData(rightIndex)
                    ]);
                };
                source.connect(processor);
                processor.connect(context.destination);
                state.audioMeter.stream = stream;
                state.audioMeter.context = context;
                state.audioMeter.source = source;
                state.audioMeter.processor = processor;
                state.audioMeter.running = true;
                state.audioMeter.requesting = false;
                state.audioMeter.status = "RUNNING";
                updateAudioMeterDom();
            }).catch(function(error) {
                stopAudioMeter();
                state.audioMeter.status = error && error.name ? error.name : "INPUT ERROR";
                updateAudioMeterDom();
            });
        }

        function baseLabel(channel) {

        }

        function emptySceneNames() {

        function selectedChannel() {

        }

        function channelControls(channel) {
            var key = channel ? channel.id : "default";
            if (!state.stripControls[key]) {
                state.stripControls[key] = {
                    hpf: null,
                    phase: false,
                    midFreqIndex: 0,
                    pan: 0,
                    stereoWidth: channel && (channel.id === "13_14" || channel.id === "15_16" || channel.id === "RTN1" || channel.id === "RTN2") ? 16 : 0,
                    stereoSpreadMode: "Stereo",
                    stereoPan: 0,
                    aux1: -70,
                    aux2: -70,
                    aux3: -70,
                    aux4: -70,
                    eff1: -70,
                    eff2: -70,
                    panPreset: "ST",
                    lowGain: 0,
                    midGain: 0,
                    highGain: 0,
                    effectReturnHpf: channel && (channel.id === "RTN1" || channel.id === "RTN2") ? "100" : null,
                    effectReturnLow: 0,
                    effectReturnMid: 0,
                    effectReturnAir: 0,
