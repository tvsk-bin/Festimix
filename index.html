                if (sendId === "aux1") return "aux2";
                if (sendId === "aux2") return "aux1";
            }
            if (state.auxLinks["3-4"]) {
                if (sendId === "aux3") return "aux4";
                if (sendId === "aux4") return "aux3";
            }
            return null;
        }

        function linkedAuxMode(mode) {
            var sendId = sendControlIdForMode(mode);
            var linked = linkedAuxSendId(sendId);
            return {
                aux1: "AUX1",
                aux2: "AUX2",
                aux3: "AUX3",
                aux4: "AUX4"
            }[linked] || null;
        }

        function isAuxModeLinked(mode) {
            var sendId = sendControlIdForMode(mode);
            return !!linkedAuxSendId(sendId);
        }

        function setAuxLink(pair, enabled) {
            state.auxLinks[pair] = !!enabled;
            render();
        }

        function faderValue(channel) {
            var sendId = sendControlIdForMode(state.mode);
            if (sendId) {
                var value = channelControls(channel)[sendId];
                return dbToMidi(value);
            }
            return state.faders[channel.id] || 0;
        }

        function updateChannelFaderState(channel, value) {
            var sendId = sendControlIdForMode(state.mode);
            var midiValue = parseInt(value, 10);
            if (sendId) {
                var dbValue = midiToDb(midiValue);
                var controls = channelControls(channel);
                controls[sendId] = dbValue;
                var linked = linkedAuxSendId(sendId);
                if (linked) controls[linked] = dbValue;
            } else {
                state.faders[channel.id] = midiValue;
            }
            return midiValue;
        }

        function dbToMidi(db) {
            var parsed = parseFloat(db);
            var value = Math.max(-70, Math.min(0, isNaN(parsed) ? -70 : parsed));
            var normalized = (value + 70) / 70;
            return Math.round(Math.pow(normalized, 1.8) * 127);
        }

        function midiToDb(value) {
            var normalized = Math.max(0, Math.min(127, parseInt(value, 10))) / 127;
            return Math.round(Math.pow(normalized, 1 / 1.8) * 70 - 70);
        }

        function midiFaderValue(value) {
            var parsed = parseInt(value, 10);
            if (isNaN(parsed)) return 0;
            return Math.max(0, Math.min(127, parsed));
        }

        function setMasterFaderValue(parameter, value) {
            state.master[parameter] = midiFaderValue(value);
            return state.master[parameter];
        }

        function setMode(mode) {
            state.mode = mode;
            state.view = "mixer";
            render();
        }

        function openMasterPage(mode) {
            state.mode = mode;
            state.view = "masterStrip";
            state.selectedId = "master:" + mode;
            state.selectedLabel = masterByMode[mode].label;
            render();
        }

        function topModeTap(mode) {
            if (isMeterDelegationMode()) {
                if (isMeterDoubleTap("mode:" + mode)) {
                    exitMeterMode();
                    setMode(mode);
                    return;
                }
                meterSelectMasterMode(mode);
                return;
            }
            if (state.copy.phase === "source") {
                setMode(mode);
                setCopySource({ type: "bus", mode: mode });
                return;
            }
            if (state.copy.phase === "targets" && state.copy.source && state.copy.source.type === "bus" && mode !== "MIX") {
                setMode(mode);
                cycleBusCopyTarget(mode);
                return;
            }
            var now = Date.now();
            if (lastTopModeTap.mode === mode && now - lastTopModeTap.time < 420) {
                lastTopModeTap = { mode: null, time: 0 };
                openMasterPage(mode);
                return;
            }
            lastTopModeTap = { mode: mode, time: now };
            setMode(mode);
        }

        function topModeSwipe(fromMode, toMode) {
            if (fromMode === "AUX1" && toMode === "AUX2") {
                setAuxLink("1-2", true);
                return true;
            }
            if (fromMode === "AUX2" && toMode === "AUX1") {
                setAuxLink("1-2", false);
                return true;
            }
            if (fromMode === "AUX3" && toMode === "AUX4") {
                setAuxLink("3-4", true);
                return true;
            }
            if (fromMode === "AUX4" && toMode === "AUX3") {
                setAuxLink("3-4", false);
                return true;
            }
            return false;
        }

        function setBank(bankId) {
            var bank = banks.find(function(item) { return item.id === bankId; });
            if (!bank || bank.disabled) return;
            if (isMeterDelegationMode() && !bank.page) {
                if (isMeterDoubleTap("bank:" + bankId)) {
                    exitMeterMode();
                }
                state.bankId = bankId;
                render();
                return;
            }
            if (isMeterDelegationMode() && (bank.page === "scenes" || bank.page === "copy")) {
                exitMeterMode();
            }
            if (bank.page === "copy") {
                copyButtonPress();
                return;
            }
            if (bank.page === "scenes") {
                if (state.view === "scenes" && state.previousViewBeforeScenes) {
                    state.view = state.previousViewBeforeScenes.view || "mixer";
                    state.selectedId = state.previousViewBeforeScenes.selectedId || state.selectedId;
                    state.selectedLabel = state.previousViewBeforeScenes.selectedLabel || state.selectedLabel;
                    state.previousViewBeforeScenes = null;
                } else {
                    state.previousViewBeforeScenes = {
                        view: state.view,
                        selectedId: state.selectedId,
                        selectedLabel: state.selectedLabel
                    };
                    state.view = "scenes";
                }
                render();
                return;
            }
            if (bank.page === "meter") {
                if (state.view === "meter" && state.previousViewBeforeMeter) {
                    state.view = state.previousViewBeforeMeter.view || "mixer";
                    state.selectedId = state.previousViewBeforeMeter.selectedId || state.selectedId;
                    state.selectedLabel = state.previousViewBeforeMeter.selectedLabel || state.selectedLabel;
                    state.previousViewBeforeMeter = null;
                } else {
                    state.previousViewBeforeMeter = {
                        view: state.view,
                        selectedId: state.selectedId,
                        selectedLabel: state.selectedLabel
                    };
                    state.view = "meter";
                }
                state.previousViewBeforeScenes = null;
                render();
                return;
            }
            state.bankId = bankId;
            state.view = "mixer";
            state.previousViewBeforeScenes = null;
            state.previousViewBeforeMeter = null;
            render();
        }

        function selectChannelByOffset(delta) {
            var liveBanks = banks.filter(function(bank) { return !bank.disabled && !bank.page; });
            var channels = currentChannels();
            var index = channels.findIndex(function(channel) { return channel.id === state.selectedId; });
            if (index < 0) index = 0;
            var nextIndex = index + delta;
            if (nextIndex < 0) {
                var bankIndex = liveBanks.findIndex(function(bank) { return bank.id === state.bankId; });
                var previousBank = liveBanks[bankIndex - 1] || liveBanks[liveBanks.length - 1];
                state.bankId = previousBank.id;
                channels = currentChannels();
                nextIndex = channels.length - 1;
            }
            if (nextIndex >= channels.length) {
                var currentBankIndex = liveBanks.findIndex(function(bank) { return bank.id === state.bankId; });
                var nextBank = liveBanks[currentBankIndex + 1] || liveBanks[0];
                state.bankId = nextBank.id;
                channels = currentChannels();
                nextIndex = 0;
            }
            var next = channels[nextIndex];
            if (!next) return;
            state.view = "strip";
            state.selectedId = next.id;
            state.selectedLabel = next.label;
            render();
        }

        function channelButton(channel) {
            if (suppressStripClick) return;
            if (isMeterDelegationMode()) {
                if (isMeterDoubleTap("channel:" + channel.id)) {
                    exitMeterMode();
                    state.view = "strip";
                    state.selectedId = channel.id;
                    state.selectedLabel = channel.label;
                    sendChannelEqBundle(channel);
                    render();
                    return;
                }
                meterToggleChannelSolo(channel);
                return;
            }
            if (state.copy.phase === "source") {
                setCopySource({ type: "channel", id: channel.id });
                return;
            }
            if (state.copy.phase === "targets" && state.copy.source && state.copy.source.type === "channel") {
                cycleChannelCopyTarget(channel);
                return;
            }
            if (state.view === "strip" && state.selectedId === channel.id) {
                state.view = "mixer";
            } else {
                state.view = "strip";
                state.selectedId = channel.id;
                state.selectedLabel = channel.label;
                sendChannelEqBundle(channel);
            }
            render();
        }

        function toggleOn(channel) {
            if (suppressStripClick) return;
            var next = !channelOnState(channel);
            state.on[channel.id] = next;
            setChannelOn(channel.midiKey, next);
            renderButtonsOnly();
        }

        function toggleSolo(channel) {
            if (suppressStripClick) return;
            var next = !state.solo[channel.id];
            if (next) clearMasterSoloState(null);
            state.solo[channel.id] = next;
            setChannelSolo(channel.soloKey, next);
            syncSoloRouting();
            renderButtonsOnly();
        }

        function applyOnState(channel, enabled) {
            if (channelOnState(channel) === enabled) return;
            state.on[channel.id] = enabled;
            setChannelOn(channel.midiKey, enabled);
        }

        function applySoloState(channel, enabled) {
            if (!!state.solo[channel.id] === enabled) return;
            if (enabled) clearMasterSoloState(null);
            state.solo[channel.id] = enabled;
            setChannelSolo(channel.soloKey, enabled);
            syncSoloRouting();
        }

        function meterToggleChannelSolo(channel) {
            if (!channel || !channel.soloKey) return;
            var next = !state.solo[channel.id];
            if (next) clearMasterSoloState(null);
            state.solo[channel.id] = next;
            setChannelSolo(channel.soloKey, next);
            syncSoloRouting();
            renderButtonsOnly();
            updateAudioMeterDom();
        }

        function setMeterChannelSolo(channel, enabled) {
            if (!channel || !channel.soloKey || !!state.solo[channel.id] === enabled) return;
            if (enabled) clearMasterSoloState(null);
            state.solo[channel.id] = enabled;
            setChannelSolo(channel.soloKey, enabled);
            syncSoloRouting();
        }

        function meterSelectMasterMode(mode) {
            var master = masterByMode[mode];
            if (!master) return;
            state.mode = mode;
            clearChannelSolos();
            clearMasterSoloState(master.id);
            state.masterSolo[master.id] = true;
            syncSoloRouting();
            render();
        }

        function meterSelectCurrentMaster() {
            meterSelectMasterMode(state.mode);
        }

        function channelMeterLabel(channel) {
            if (!channel) return "";
            var suffix = ((state.sceneSaved[state.loadedScene] || {})[channel.id] || "").trim();
            return suffix ? baseLabel(channel) + " " + suffix : baseLabel(channel);
        }

        function masterById(id) {
            var result = null;
            Object.keys(masterByMode).some(function(mode) {
                if (masterByMode[mode].id === id) {
                    result = masterByMode[mode];
                    return true;
                }
                return false;
            });
            return result;
        }

        function isMonoMasterMeterSource(master) {
            return master && (master.id === "aux1" || master.id === "aux2" || master.id === "aux3" || master.id === "aux4");
        }

        function meterDisplayContext() {
            var channels = allChannels().filter(function(channel) { return !!state.solo[channel.id]; });
            if (channels.length) {
                var labels = channels.map(channelMeterLabel);
                var title = channels.length > 1 ? "SUM OF: " + labels.join(", ") : labels[0];
                var stereo = channels.some(isStereoWidthSource);
                return { leftLabel: title, rightLabel: stereo ? title : "", stereo: stereo };
            }

            var masterId = state.activeMasterSoloTarget || activeManualMasterSoloTarget() || "stereo";
            var master = masterById(masterId) || masterByMode.MIX;
            var label = master.label;
            var masterStereo = !isMonoMasterMeterSource(master);
            return { leftLabel: label, rightLabel: masterStereo ? label : "", stereo: masterStereo };
        }

        function knobLabel(knob, value) {
            if (knob.dataset.control === "compAmount") return value;
            if (knob.dataset.control === "compPreset") return compressorPresets[value] || compressorPresets[0];
            if (knob.classList.contains("comp") && value <= 0) return "OFF";
            return value + (knob.dataset.unit || "");
        }

        function setKnobValue(knob, value, silent) {
            var min = parseFloat(knob.dataset.min);
            var max = parseFloat(knob.dataset.max);
            var stepSize = parseFloat(knob.dataset.step || "1");
            var stepped = Math.round(Math.max(min, Math.min(max, value)) / stepSize) * stepSize;
            stepped = Math.round(stepped * 100) / 100;
            if (knob.dataset.detent === "center") {
                var center = parseFloat(knob.dataset.center || "0");
                if (Math.abs(stepped - center) <= 1) stepped = center;
            }
            var percent = (stepped - min) / (max - min);
            if (knob.dataset.scale === "log") {
                var safeMin = Math.max(1, min);
                percent = (Math.log(Math.max(safeMin, stepped)) - Math.log(safeMin)) / (Math.log(max) - Math.log(safeMin));
            }
            var angleMin = parseFloat(knob.dataset.angleMin || "-135");
            var angleMax = parseFloat(knob.dataset.angleMax || "135");
            var angleRange = angleMax - angleMin;
            var knobAngle = angleMin + percent * angleRange;
            knob.dataset.value = stepped;
            knob.style.setProperty("--angle", knobAngle + "deg");
            knob.textContent = knobLabel(knob, stepped);
            knob.dataset.lastAngle = String(knobAngle);
            if (knob.dataset.control) {
                var channel = selectedChannel();
                var controls = channelControls(channel);
                controls[knob.dataset.control] = stepped;
                if (knob.dataset.control === "compPreset") {
                    controls.compPresetIndex = stepped;
                    controls.comp = stepped;
                    var presetName = compressorPresets[stepped] || compressorPresets[0];
                    var presetLabel = knob.closest(".control-cell").querySelector("[data-comp-preset-name]");
                    if (presetLabel) presetLabel.textContent = presetName;
                    if (!silent && channel.id !== "RTN1" && channel.id !== "RTN2") sendCompressorControl(channel, presetName, controls);
                } else if (knob.dataset.control === "compAmount") {
                    controls.compPosition = stepped;
                    var currentPreset = compressorPresets[controls.compPresetIndex] || compressorPresets[0];
                    if (!silent && channel.id !== "RTN1" && channel.id !== "RTN2") sendCompressorControl(channel, currentPreset, controls);
                } else {
                    if (!silent && knob.dataset.control === "pan") sendPanControl(channel, stepped);
                    if (!silent && knob.dataset.control === "stereoPan") sendStereoSpreadControl(channel, controls.stereoSpreadMode, stepped);
                    if (!silent && knob.dataset.eq === "1") sendEqControl(channel, knob.dataset.control, stepped);
                }
            }
            if (knob.dataset.masterEq) {
                var master = masterByMode[state.mode];
                masterEqControls(master)[knob.dataset.masterEq] = stepped;
                if (!silent) {
                    var masterEqControl = {
                        low: "lowGain",
                        lowMid: "lowMidGain",
                        highMid: "highMidGain",
                        high: "highGain"
                    }[knob.dataset.masterEq];
                    if (masterEqControl) sendMasterEqControl(master, masterEqControl, stepped);
                    var auxEqControl = {
                        auxNotch1Freq: "lowNotchFreq",
                        auxNotch2Freq: "highNotchFreq",
                        auxPresence: "presence"
                    }[knob.dataset.masterEq];
                    if (auxEqControl) sendAuxEqControl(master, auxEqControl, stepped);
                }
            }
            if (knob.dataset.effectReturnEq) {
                var returnChannel = selectedChannel();
                var returnControls = channelControls(returnChannel);
                returnControls[knob.dataset.effectReturnEq] = stepped;
                if (!silent) sendEffectReturnEqControl(returnChannel, {
                    effectReturnLow: "low",
                    effectReturnMid: "mid",
                    effectReturnAir: "air"
                }[knob.dataset.effectReturnEq], stepped);
            }
            if (knob.dataset.masterComp) {
                var masterForComp = masterByMode[state.mode];
                var masterCompControls = masterEqControls(masterForComp);
                masterCompControls[knob.dataset.masterComp] = stepped;
                masterCompControls.compOn = true;
                if (!silent) sendMasterCompressorParameter(masterForComp, knob.dataset.masterComp, stepped);
            }
        }

        function valueFromPointer(knob, event) {
            var rect = knob.getBoundingClientRect();
            var centerX = rect.left + rect.width / 2;
            var centerY = rect.top + rect.height / 2;
            var angle = Math.atan2(event.clientY - centerY, event.clientX - centerX) * 180 / Math.PI;
            var relative = angle + 90;
            if (relative < -180) relative += 360;
            if (relative > 180) relative -= 360;
            var currentValue = parseFloat(knob.dataset.value || knob.dataset.min || "0");
            var lastAngle = parseFloat(knob.dataset.lastAngle || "0");
            var angleMin = parseFloat(knob.dataset.angleMin || "-135");
            var angleMax = parseFloat(knob.dataset.angleMax || "135");
            var angleRange = angleMax - angleMin;
            if (relative < angleMin || relative > angleMax) {
                return currentValue;
            }
            if (Math.abs(relative - lastAngle) > 180) {
                return currentValue;
            }
            var clamped = Math.max(angleMin, Math.min(angleMax, relative));
            var min = parseFloat(knob.dataset.min);
            var max = parseFloat(knob.dataset.max);
            if (knob.dataset.scale === "log") {
                var safeMin = Math.max(1, min);
                var logValue = Math.log(safeMin) + ((clamped - angleMin) / angleRange) * (Math.log(max) - Math.log(safeMin));
                return Math.exp(logValue);
            }
            return min + ((clamped - angleMin) / angleRange) * (max - min);
        }

        function bindKnobs(root) {
            Array.prototype.forEach.call(root.querySelectorAll(".knob[data-min]"), function(knob) {
                setKnobValue(knob, parseFloat(knob.dataset.value || "0"), true);
                knob.onpointerdown = function(event) {
                    event.preventDefault();
                    knob.setPointerCapture(event.pointerId);
                    setKnobValue(knob, valueFromPointer(knob, event));
                };
                knob.onpointermove = function(event) {
                    if (!knob.hasPointerCapture(event.pointerId)) return;
                    setKnobValue(knob, valueFromPointer(knob, event));
                };
            });
        }

        function renderSendRow(id, value, disabled) {
            return "<div class='send-row" + (disabled ? " disabled" : "") + "' data-send='" + id + "' data-disabled='" + (disabled ? "1" : "0") + "'><div class='value-box swipe-value' data-swipe-send='" + id + "'>" + value + "</div></div>";
        }

        function renderCompressorCell(channel, controls) {
            if (channel.id === "RTN1" || channel.id === "RTN2") {
                return "<div class='control-cell disabled'><div class='control-label'>COMP</div><div class='mini-row comp-preset-row'><div class='value-box'>OFF</div></div><div class='knob comp'>OFF</div></div>";
            }
            return "<div class='control-cell'><div class='control-label'>COMP</div><div class='mini-row comp-preset-row'><div class='value-box swipe-value' data-comp-preset-name='1' data-comp-preset-swipe='1'>" + compressorPresets[controls.compPresetIndex] + "</div></div><div class='knob comp' data-control='compAmount' data-min='0' data-max='127' data-step='1' data-value='" + controls.compPosition + "' data-unit=''>64</div></div>";
        }

        function sendParameterForSend(channel, id, value) {
            if (channel && channel.id === "RTN1" && id === "eff1") return;
            if (channel && channel.id === "RTN2" && id === "eff2") return;
            var modeMap = {
                aux1: "auxSend.AUX1.",
                aux2: "auxSend.AUX2.",
                aux3: "auxSend.AUX3.",
                aux4: "auxSend.AUX4.",
                eff1: "fx2Send.",
                eff2: "fx1Send."
            };
            var effectReturnMap = {
                aux1: "effectReturnSend.aux1.",
                aux2: "effectReturnSend.aux2.",
                aux3: "effectReturnSend.aux3.",
                aux4: "effectReturnSend.aux4.",
                eff1: "effectReturnSend.eff1.",
                eff2: "effectReturnSend.eff2.",
                MIX: "effectReturnSend.master."
            };
            if (channel.id === "RTN1" || channel.id === "RTN2") {
                var returnId = channel.id === "RTN1" ? "effRtn1" : "effRtn2";
                var returnPrefix = effectReturnMap[id] || effectReturnMap[state.mode] || null;
                if (!returnPrefix) return;
                sendParameter(returnPrefix + returnId, dbToMidi(value));
                return;
            }
            var prefix = modeMap[id];
            if (!prefix || !channel) return;
            var midiValue = dbToMidi(value);
            sendParameter(prefix + channel.midiKey, midiValue);
        }

        function pageTabs(items, active, attribute) {
            return "<div class='page-tabs two'>" + items.map(function(item) {
                return "<button class='btn-hw" + (item.id === active ? " active" : "") + "' " + attribute + "='" + item.id + "'>" + item.label + "</button>";
            }).join("") + "</div>";
        }

        function bindPageTabs(root, selector, callback) {
            Array.prototype.forEach.call(root.querySelectorAll(selector), function(button) {
                button.onclick = function() {
                    callback(button);
                };
            });
        }

        function panCellHtml(channel, controls) {
            if (isStereoWidthSource(channel)) {
                var mode = controls.stereoSpreadMode || "Stereo";
                var config = stereoSpreadConfig[mode] || stereoSpreadConfig.Stereo;
                var min = config.panRange[0];
                var max = config.panRange[1];
                if (controls.stereoPan < min) controls.stereoPan = min;
                if (controls.stereoPan > max) controls.stereoPan = max;
                var panControl = config.panDisabled ?
                    "<div class='knob disabled'>0</div>" :
                    "<div class='knob' data-control='stereoPan' data-min='" + min + "' data-max='" + max + "' data-center='0' data-detent='center' data-value='" + controls.stereoPan + "' data-unit=''>0</div>";
                return [
                    "<div class='control-cell'><div class='control-label'>PAN</div><div class='pan-stereo-stack'>",
                    "<div class='mini-row'><div class='value-box swipe-value' data-stereo-spread='1'>" + mode + "</div></div>",
                    panControl,
                    "</div></div>"
                ].join("");
            }
            return "<div class='control-cell'><div class='control-label'>PAN</div><div class='knob' data-control='pan' data-min='-16' data-max='16' data-center='0' data-detent='center' data-value='" + controls.pan + "' data-unit=''>0</div></div>";
        }

        function bindStripButtons(root, channel) {
            var controls = channelControls(channel);
            function stepMidFrequency(step, valueBox) {
                var next = Math.max(0, Math.min(midFreqPresets.length - 1, controls.midFreqIndex + step));
                if (next === controls.midFreqIndex) return;
                controls.midFreqIndex = next;
                sendEqControl(channel, "midFrequency", midFreqPresets[controls.midFreqIndex]);
                if (valueBox) valueBox.textContent = midFreqPresets[controls.midFreqIndex];
            }

            function stepStereoSpread(step, valueBox) {
                var current = stereoSpreadPresets.indexOf(controls.stereoSpreadMode || "Stereo");
                if (current < 0) current = 0;
                var next = Math.max(0, Math.min(stereoSpreadPresets.length - 1, current - step));
                if (next === current) return;
                controls.stereoSpreadMode = stereoSpreadPresets[next];
                var config = stereoSpreadConfig[controls.stereoSpreadMode] || stereoSpreadConfig.Stereo;
                controls.stereoPan = Math.max(config.panRange[0], Math.min(config.panRange[1], controls.stereoPan || 0));
                sendStereoSpreadControl(channel, controls.stereoSpreadMode, controls.stereoPan);
                if (valueBox) valueBox.textContent = controls.stereoSpreadMode;
                renderStripPage();
            }

            function stepSendValue(row, step) {
                if (!row || row.dataset.disabled === "1") return;
                var id = row.dataset.send;
                var next = Math.max(-70, Math.min(0, controls[id] + step));
                if (next === controls[id]) return;
                controls[id] = next;
                sendParameterForSend(channel, id, controls[id]);
                var linked = linkedAuxSendId(id);
                if (linked) {
                    controls[linked] = next;
                    sendParameterForSend(channel, linked, controls[linked]);
                }
                var valueBox = row.querySelector(".value-box");
                if (valueBox) valueBox.textContent = controls[id];
            }

            function stepCompPreset(valueBox, step) {
                var next = Math.max(0, Math.min(compressorPresets.length - 1, controls.compPresetIndex + step));
                if (next === controls.compPresetIndex) return;
                controls.compPresetIndex = next;
                controls.comp = next;
                controls.compPosition = 64;
                var presetName = compressorPresets[next] || compressorPresets[0];
                valueBox.textContent = presetName;

            Array.prototype.forEach.call(page.querySelectorAll("[data-aux-notch-gain]"), function(valueBox) {
                var swipe = null;

                valueBox.ondblclick = function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    return false;
                };
                valueBox.onclick = function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    return false;
                };
                valueBox.onpointerdown = function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    valueBox.setPointerCapture(event.pointerId);
                    swipe = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, done: false, moved: false };
                };
                valueBox.onpointermove = function(event) {
                    if (!swipe || swipe.done || event.pointerId !== swipe.pointerId) return;
                    event.preventDefault();
                    event.stopPropagation();
                    var dx = event.clientX - swipe.startX;
                    var dy = event.clientY - swipe.startY;
                    var horizontal = Math.abs(dx) > Math.abs(dy);
                    var amount = horizontal ? dx : dy;
                    if (Math.abs(amount) < 26) return;
                    var key = "auxNotch" + valueBox.dataset.auxNotchGain + "GainIndex";
                    var initKey = "auxNotch" + valueBox.dataset.auxNotchGain + "Init";
                    swipe.moved = true;
                    if (eq[initKey]) {
                        eq[initKey] = false;
                        eq[key] = 0;
                        valueBox.textContent = auxNotchGainPresets[eq[key]] + " dB";
                        sendAuxEqControl(master, valueBox.dataset.auxNotchGain === "1" ? "lowNotchGain" : "highNotchGain", auxNotchGainPresets[eq[key]]);
                        swipe.done = true;
                        return;
                    }
                    var step = horizontal ? (amount < 0 ? 1 : -1) : (amount > 0 ? 1 : -1);
                    var next = Math.max(0, Math.min(auxNotchGainPresets.length - 1, eq[key] + step));
                    if (next !== eq[key]) {
                        eq[key] = next;
                    }
                    valueBox.textContent = auxNotchGainPresets[eq[key]] + " dB";
                    sendAuxEqControl(master, valueBox.dataset.auxNotchGain === "1" ? "lowNotchGain" : "highNotchGain", auxNotchGainPresets[eq[key]]);
                    swipe.done = true;
                };
                valueBox.onpointerup = valueBox.onpointercancel = function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    if (valueBox.hasPointerCapture && valueBox.hasPointerCapture(event.pointerId)) {
                        valueBox.releasePointerCapture(event.pointerId);
                    }
                    if (swipe && !swipe.moved && event.type === "pointerup") {
                        var now = Date.now();
                        if (now - lastTap < 350) {
                            var initKey = "auxNotch" + valueBox.dataset.auxNotchGain + "Init";

                            lastTap = 0;

                        }
                    }
                    swipe = null;
                };
            });
        }

        function bindStripDrag(grid) {
            var drag = null;
            function buttonFromPoint(event) {
                var element = document.elementFromPoint(event.clientX, event.clientY);
                var button = element && element.closest ? element.closest("[data-strip-action]") : null;
                if (!button || !drag || button.dataset.stripAction !== drag.action) return null;
                return button;
            }
            function channelFromButton(button) {
                return currentChannels().find(function(channel) { return channel.id === button.dataset.channelId; });
            }
            function refreshTouchedButton(button, channel) {
                if (!button || !channel) return;
                if (button.dataset.stripAction === "on") button.className = "btn-hw on-btn " + (channelOnState(channel) ? "on" : "off");
                if (button.dataset.stripAction === "solo") button.className = "btn-hw solo" + (state.solo[channel.id] ? " on" : "");
            }
            function toggleDragButton(button) {
                if (!button || !drag || drag.touched[button.dataset.channelId]) return;
                var channel = channelFromButton(button);
                if (!channel) return;
                drag.touched[button.dataset.channelId] = true;
                if (drag.action === "on") {
                    state.on[channel.id] = !channelOnState(channel);
                    setChannelOn(channel.midiKey, state.on[channel.id]);
                }
                if (drag.action === "solo") {
                    var nextSolo = !state.solo[channel.id];
                    if (nextSolo) clearMasterSoloState(null);
                    state.solo[channel.id] = nextSolo;
                    setChannelSolo(channel.soloKey, nextSolo);
                    syncSoloRouting();
                }
                refreshTouchedButton(button, channel);
            }
            grid.onpointerdown = function(event) {
                var button = event.target.closest("[data-strip-action]");
                if (!button) return;
                var channel = channelFromButton(button);
                if (!channel) return;
                event.preventDefault();
                grid.setPointerCapture(event.pointerId);
                drag = {
                    action: button.dataset.stripAction,
                    startButton: button,
                    pointerId: event.pointerId,
                    startX: event.clientX,
                    startY: event.clientY,
                    active: false,
                    touched: {}
                };
            };
            grid.onpointermove = function(event) {
                if (!drag) return;
                if (!drag.active && Math.abs(event.clientX - drag.startX) + Math.abs(event.clientY - drag.startY) > 18) {
                    drag.active = true;
                    toggleDragButton(drag.startButton);
                }
                if (!drag.active) return;
                toggleDragButton(buttonFromPoint(event));
            };
            grid.onpointerover = function(event) {
                if (!drag || !drag.active) return;
                toggleDragButton(buttonFromPoint(event));
            };
            window.onpointerup = function(event) {
                if (drag && event.pointerId !== drag.pointerId) return;
                var shouldRefreshStrips = drag && drag.action === "solo";
                if (drag && grid.hasPointerCapture && grid.hasPointerCapture(event.pointerId)) {
                    grid.releasePointerCapture(event.pointerId);
                }
                if (drag && !drag.active) {
                    toggleDragButton(drag.startButton);
                    suppressStripClick = true;
                    setTimeout(function() { suppressStripClick = false; }, 120);
                    drag = null;
                    if (shouldRefreshStrips) renderButtonsOnly();
                    return;
                }
                if (drag && drag.active) {
                    suppressStripClick = true;
                    setTimeout(function() { suppressStripClick = false; }, 120);
                }
                drag = null;
                if (shouldRefreshStrips) renderButtonsOnly();
            };
        }

        function bindMeterChannelRowSwipe(root) {
            var drag = null;
            function buttonFromPoint(event) {
                var element = document.elementFromPoint(event.clientX, event.clientY);
                var button = element && element.closest ? element.closest("[data-meter-channel]") : null;
                if (!button || !drag) return null;
                return button;
            }
            function channelFromButton(button) {
                return currentChannels().find(function(channel) { return channel.id === button.dataset.meterChannel; });
            }
            function touchButton(button) {
                if (!button || !drag || drag.touched[button.dataset.meterChannel]) return;
                var channel = channelFromButton(button);
                if (!channel) return;
                drag.touched[button.dataset.meterChannel] = true;
                setMeterChannelSolo(channel, drag.targetState);
                button.classList.toggle("active", drag.targetState);
            }
            root.onpointerdown = function(event) {
                var button = event.target.closest("[data-meter-channel]");
                if (!button) return;
                var channel = channelFromButton(button);
                if (!channel) return;
                event.preventDefault();
                root.setPointerCapture(event.pointerId);
                drag = {
                    pointerId: event.pointerId,
                    startButton: button,
                    startX: event.clientX,
                    startY: event.clientY,
                    targetState: !state.solo[channel.id],
                    active: false,
                    touched: {}
                };
            };
            root.onpointermove = function(event) {
                if (!drag || event.pointerId !== drag.pointerId) return;
                if (!drag.active && Math.abs(event.clientX - drag.startX) + Math.abs(event.clientY - drag.startY) > 18) {
                    drag.active = true;
                    suppressStripClick = true;
                    touchButton(drag.startButton);
                }
                if (!drag.active) return;
                touchButton(buttonFromPoint(event));
            };
            root.onpointerover = function(event) {
                if (!drag || !drag.active) return;
                touchButton(buttonFromPoint(event));
            };
            window.onpointerup = function(event) {
                if (drag && event.pointerId !== drag.pointerId) return;
                if (drag && root.hasPointerCapture && root.hasPointerCapture(event.pointerId)) {
                    root.releasePointerCapture(event.pointerId);
                }
                if (drag && drag.active) {
                    suppressStripClick = true;
                    setTimeout(function() { suppressStripClick = false; }, 120);
                    renderButtonsOnly();
                    updateAudioMeterDom();
                }
                drag = null;
            };
        }

                state.view = state.view === "masterStrip" ? "mixer" : "masterStrip";
                state.selectedId = "master:" + state.mode;
                state.selectedLabel = master.label;
                render();
            };

            root.appendChild(solo);
            root.appendChild(title);
            root.appendChild(faderBox);
            root.appendChild(on);
            root.appendChild(select);
            updateInlineMeterDom();
        }

        function renderButtonsOnly() {
            renderChannelRow();
            renderMaster();
            if (state.view === "mixer") renderMixer();
            syncSoloRouting();
        }

        function render() {
            renderTopBar();
            renderBankBar();
            renderChannelRow();
            renderMaster();
            if (state.view === "strip") renderStripPage();
            else if (state.view === "masterStrip") renderMasterStripPage();
            else if (state.view === "scenes") renderScenesPage();
            else if (state.view === "meter") renderMeterPage();
            else renderMixer();
            syncSoloRouting();
        }

        loadScenes();
        socket.on("scene store", applySceneStore);
        socket.on("meter config", applyMeterConfig);
        socket.on("audio meter frame", applyAudioMeterFrame);
        socket.on("audio meter request", handleAudioMeterRequest);
        render();
    </script>
</body>

</html>
