<!DOCTYPE html>
<html>

<head>
    <title>Festimix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="./assets/manifest.json">
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/style.css">
    <style>
        :root {
            --bg: #111315;
            --panel: #202326;
            --panel-dark: #0c0e10;
            --line: #343a3f;
            --text: #f2f2f2;
            --muted: #b8b8b8;
            --active: #1f7acb;
            --solo: #f0c33c;
            --on: #1fb96b;
            --off: #5a1e22;
            --bank-bar-width: clamp(42px, 5.4vw, 58px);
            --bus-select-height: clamp(58px, 9vh, 86px);
            --channel-select-height: var(--bus-select-height);
            --channel-select-button-height: calc(var(--channel-select-height) - 16px);
            --strip-button-height: clamp(42px, 6vh, 52px);
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        #orientation {
            display: none !important;
        }

        .app {
            height: 100dvh;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        .top-bar {
            flex: 0 0 var(--bus-select-height);
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 8px;
            padding: 8px;
            background: var(--panel-dark);
            border-bottom: 1px solid var(--line);
            touch-action: none;
        }

        .top-bar .btn-hw {
            width: 100%;
            height: 100%;
            min-height: 0;
            padding: 6px 8px;
        }

        .main {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            overflow: hidden;
        }

        .bank-bar {
            flex: 0 0 var(--bank-bar-width);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px 5px 8px;
            background: var(--panel-dark);
            border-right: 2px solid var(--line);
            position: relative;
            overflow: visible;
        }

        .center {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #171a1d;
        }

        .work-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            padding: 10px;
        }

        .channel-row {
            flex: 0 0 var(--channel-select-height);
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 6px;
            padding: 8px;
            background: var(--panel-dark);
            border-top: 1px solid var(--line);
            position: relative;
        }

        .channel-row .btn-hw {
            aspect-ratio: 1.25 / 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            line-height: 1.05;
            position: relative;
        }

        .channel-button-main {
            font-size: clamp(11px, 1.2vw, 14px);
            font-weight: 900;
        }

        .channel-button-name {
            max-width: 100%;
            font-size: clamp(9px, 1vw, 12px);
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .channel-copyright {
            position: absolute;
            right: 3px;
            bottom: 12px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: rgba(184, 184, 184, 0.58);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1;
            pointer-events: none;
        }

        .master {
            flex: 0 0 clamp(118px, 14vw, 168px);
            min-width: 112px;
            padding: 10px;
            background: var(--panel-dark);
            border-left: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
        }

        .btn-hw {
            border: 1px solid #3d444b;
            background: #272c31;
            color: var(--text);
            min-height: 42px;
            padding: 6px 8px;
            font-weight: 700;
            font-size: clamp(11px, 1.4vw, 15px);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            border-radius: 5px;
            box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.45);
        }

        .btn-hw.active {
            background: var(--active);
            border-color: #6cb5ff;
            box-shadow: 0 0 12px rgba(31, 122, 203, 0.38), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .bank-bar .btn-hw {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            min-height: 86px;
            padding: 8px 2px;
        }

        .btn-hw.solo {
            background: #101214;
        }

        .btn-hw.solo.on {
            background: var(--solo);
            color: #111;
            border-color: #ffe36d;
            box-shadow: 0 0 16px rgba(240, 195, 60, 0.58);
        }

        .btn-hw.on-btn.on {
            background: var(--on);
            border-color: #80f0b5;
            color: #06140d;
            box-shadow: 0 0 16px rgba(31, 185, 107, 0.5);
        }

        .btn-hw.on-btn.off {
            background: #050505;
            color: #d6d6d6;
            border-color: #333a40;
        }

        .btn-hw.disabled {
            opacity: 0.45;
        }

        .strip-grid {
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 8px;
            overflow: hidden;
        }

        .strip {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            padding: 9px 6px;
            background: var(--panel);
            border: 1px solid #2c3237;
            border-radius: 6px;
        }

        .strip .btn-hw {
            flex: 0 0 var(--strip-button-height);
            font-size: clamp(9px, 0.95vw, 12px);
            padding: 4px 2px;
        }

        .fader-box {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 4px 0 2px;
        }

        .channel-meter-fader-box {
            padding: 4px 0;
        }

        .strip-fader-main {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .strip-pan-fader {
            flex: 0 0 clamp(18px, 2.8vh, 24px);
            width: min(84%, 86px);
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            touch-action: none;
        }

        .strip-pan-fader::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 999px;
            background: #3d4247;
            border: 1px solid #5c646c;
        }

        .strip-pan-fader::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: clamp(16px, 1.8vw, 22px);
            height: clamp(16px, 1.8vw, 22px);
            margin-top: calc((6px - clamp(16px, 1.8vw, 22px)) / 2);
            border: 1px solid #f1f1f1;
            background: #d8d8d8;
            border-radius: 50%;
        }

        .strip-pan-fader::-moz-range-track {
            height: 6px;
            border-radius: 999px;
            background: #3d4247;
            border: 1px solid #5c646c;
        }

        .strip-pan-fader::-moz-range-thumb {
            width: clamp(16px, 1.8vw, 22px);
            height: clamp(16px, 1.8vw, 22px);
            border: 1px solid #f1f1f1;
            background: #d8d8d8;
            border-radius: 50%;
        }

        .strip-pan-fader:disabled {
            opacity: 0.34;
            filter: grayscale(1);
        }

        .channel-meter-fader-shell {
            position: relative;
            width: clamp(42px, 4.6vw, 58px);
            height: 82%;
            min-height: 92px;
            max-height: 100%;
        }

        .channel-fader-meter {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: clamp(18px, 2.1vw, 26px);
            transform: translateX(-50%);
            overflow: hidden;
            border: 1px solid #4a535c;
            border-radius: 6px;
            background: #0b0d0f;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
            pointer-events: none;
        }

        .channel-fader-meter-fill {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 0%;
            background: linear-gradient(to top, #145c2d 0%, #1fb96b 62%, #d6aa21 80%, #d06618 92%, #d93030 100%);
            transition: height 0.08s linear;
        }

        .channel-fader-meter-hold {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0%;
            height: 2px;
            background: #f2f2f2;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.65);
        }

        input[type="range"].v-fader {
            writing-mode: vertical-lr;
            direction: rtl;
            -webkit-appearance: none;
            appearance: none;
            width: clamp(42px, 4.6vw, 58px);
            height: 82%;
            min-height: 92px;
            max-height: 100%;
            accent-color: #d8d8d8;
            background: transparent;
            touch-action: none;
        }

        input[type="range"].v-fader::-webkit-slider-runnable-track {
            width: 8px;
            height: 100%;
            border-radius: 999px;
            background: #3d4247;
            border: 1px solid #5c646c;
        }

        input[type="range"].v-fader::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: clamp(28px, 3.4vw, 42px);
            height: clamp(28px, 3.4vw, 42px);
            margin-left: calc((8px - clamp(28px, 3.4vw, 42px)) / 2);
            border: 2px solid #f1f1f1;
            background: #d8d8d8;
            border-radius: 50%;
        }

        input[type="range"].v-fader.meter-fader {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            min-height: 0;
            z-index: 2;
        }

        input[type="range"].v-fader.meter-fader::-webkit-slider-runnable-track {
            background: transparent;
            border-color: transparent;
        }

        input[type="range"].v-fader.meter-fader::-webkit-slider-thumb {
            width: clamp(24px, 2.8vw, 34px);
            height: clamp(24px, 2.8vw, 34px);
            margin-left: 18px;
            border: 0;
            background: #d8d8d8;
            border-radius: 0;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
            box-shadow: -2px 0 8px rgba(0,0,0,0.45);
        }

        input[type="range"].v-fader::-moz-range-track {
            width: 8px;
            height: 100%;
            border-radius: 999px;
            background: #3d4247;
            border: 1px solid #5c646c;
        }

        input[type="range"].v-fader::-moz-range-thumb {
            width: clamp(28px, 3.4vw, 42px);
            height: clamp(28px, 3.4vw, 42px);
            border: 2px solid #f1f1f1;
            background: #d8d8d8;
            border-radius: 50%;
        }

        input[type="range"].v-fader.meter-fader::-moz-range-track {
            background: transparent;
            border-color: transparent;
        }

        input[type="range"].v-fader.meter-fader::-moz-range-thumb {
            width: clamp(24px, 2.8vw, 34px);
            height: clamp(24px, 2.8vw, 34px);
            border: 0;
            background: #d8d8d8;
            border-radius: 0;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
            box-shadow: -2px 0 8px rgba(0,0,0,0.45);
        }

        .master input[type="range"].v-fader {
            accent-color: #d93030;
        }

        .master input[type="range"].v-fader::-webkit-slider-thumb {
            background: #d93030;
            border-color: #ff7474;
        }

        .master input[type="range"].v-fader::-moz-range-thumb {
            background: #d93030;
            border-color: #ff7474;
        }

        .master-title {
            display: none;
        }

        .master .fader-box {
            flex: 1 1 auto;
        }

        .master .solo,
        .master .on-btn {
            flex: 0 0 var(--strip-button-height);
            font-size: clamp(9px, 0.95vw, 12px);
            padding: 4px 2px;
        }

        .strip-page {
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: transparent;
            border: 0;
        }

        .strip-header {
            display: none;
        }

        .strip-title {
            text-align: center;
            font-size: clamp(18px, 2.6vw, 30px);
            font-weight: 800;
        }

        .placeholder {
            flex: 1 1 auto;
            min-height: 0;
            padding: 18px;
            color: var(--muted);
            font-size: clamp(15px, 2vw, 22px);
        }

        .strip-body {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
            padding: 6px 4px 8px;
        }

        .strip-section {
            min-height: 0;
            display: grid;
            gap: 10px;
        }

        .eq-section {
            grid-template-columns: 1fr 1fr 1.45fr 1fr;
        }

        .utility-section {
            grid-template-columns: 1fr 1fr 1.15fr 1.15fr;
        }

        .control-cell {
            min-width: 0;
            min-height: 0;
            border: 0;
            background: #1d2227;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px;
            border-radius: 7px;
        }

        .control-cell.phase-hpf {
            justify-content: space-between;
        }

        .mid-cell {
            gap: 10px;
        }

        .control-label {
            color: var(--muted);
            font-size: clamp(10px, 1.15vw, 13px);
            font-weight: 800;
        }

        .knob {
            width: clamp(58px, 8vw, 96px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid #747474;
            background: radial-gradient(circle at 50% 50%, #303030 0 48%, #171717 50% 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: clamp(12px, 1.4vw, 16px);
            font-weight: 800;
            touch-action: none;
            user-select: none;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.08), 0 5px 14px rgba(0,0,0,0.25);
        }

        .knob::before {
            content: "";
            position: absolute;
            width: 4px;
            height: 32%;
            top: 8%;
            left: calc(50% - 2px);
            background: #d8d8d8;
            border-radius: 3px;
            transform: rotate(var(--angle, 0deg));
            transform-origin: 50% 130%;
        }

        .knob.disabled {
            opacity: 0.38;
            filter: grayscale(1);
            pointer-events: none;
        }

        .button-stack {
            width: 100%;
            display: grid;
            gap: 5px;
        }

        .pan-stereo-stack {
            width: 100%;
            display: grid;
            gap: 6px;
            justify-items: center;
        }

        .pan-stereo-top {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .hpf-stack {
            width: 100%;
            display: grid;
            gap: 6px;
        }

        .hpf-pair {
            display: grid;
            gap: 5px;
        }

        .mini-row {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(92px, 52%);
            justify-content: center;
            gap: 5px;
            align-items: center;
        }

        .mini-row.ratio-row {
            grid-template-columns: minmax(104px, 62%);
        }

        .mini-row.notch-row {
            grid-template-columns: minmax(104px, 62%);
        }

        .mini-row.comp-preset-row {
            grid-template-columns: minmax(108px, 58%);
        }

        .value-box {
            min-height: 36px;
            border: 1px solid #3c444b;
            background: #0b0d0f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            border-radius: 5px;
            white-space: nowrap;
            font-size: clamp(11px, 1.25vw, 15px);
        }

        .swipe-value {
            min-height: clamp(44px, 6.2vh, 54px);
            padding: 6px 10px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        [data-aux-notch-gain] {
            touch-action: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .strip-nav {
            flex: 0 0 clamp(58px, 8vh, 78px);
            display: grid;
            grid-template-columns: minmax(84px, 0.8fr) minmax(0, 2.6fr) minmax(84px, 0.8fr);
            gap: 8px;
            padding: 8px;
            background: var(--panel-dark);
            border-top: 1px solid var(--line);
        }

        .channel-row.strip-nav-row {
            grid-template-columns: minmax(84px, 0.75fr) minmax(0, 2.7fr) minmax(84px, 0.75fr);
        }

        .strip-channel-name {
            display: grid;
            grid-template-columns: auto minmax(80px, max-content);
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 0;
            background: #171b1f;
            border: 1px solid #303840;
            border-radius: 6px;
            font-weight: 900;
            font-size: clamp(14px, 2vw, 22px);
            padding: 0 10px;
        }

        .strip-channel-name span {
            flex: 0 0 auto;
        }

        .strip-channel-name input {
            width: min(42vw, 360px);
            min-width: 80px;
            height: 38px;
            background: transparent;
            color: var(--text);
            border: 0;
            outline: 0;
            font: inherit;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
        }

        .strip-page-nav {
            flex: 0 0 clamp(48px, 6.8vh, 64px);
            display: grid;
            grid-template-columns: minmax(84px, 0.75fr) minmax(0, 2.7fr) minmax(84px, 0.75fr);
            gap: 8px;
            padding: 4px 4px 0;
        }

        .send-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
        }

        .send-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 5px;
            align-items: center;
        }

        .send-row .swipe-value {
            min-height: clamp(34px, 4.6vh, 42px);
            padding: 4px 8px;
        }

        .master-eq-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .master-comp-grid {
            grid-template-columns: 0.8fr 1fr 1fr 1.2fr;
        }

        .master-comp-preset-grid {
            grid-template-columns: minmax(150px, 220px);
            justify-content: start;
        }

        .effect-selector-grid {
            grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) minmax(0, 1fr);
        }

        .empty-module-slot {
            min-height: 0;
            border: 1px dashed rgba(80, 90, 100, 0.24);
            border-radius: 6px;
            background: rgba(8, 10, 12, 0.28);
        }

        .effect-preset-cell {
            align-items: stretch;
        }

        .assist-eq-body {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 3fr) minmax(180px, 1fr);
            gap: 10px;
            padding: 6px 4px 8px;
        }

        .assist-eq-left {
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) clamp(82px, 13vh, 116px);
            gap: 10px;
        }

        .raw-eq-pad {
            min-height: 0;
            position: relative;
            overflow: hidden;
            border: 1px solid #303840;
            border-radius: 7px;
            background: #11161a;
            touch-action: none;
        }

        .raw-eq-pad::after {
            content: "";
            position: absolute;
            inset: 0;
            background: transparent;
            pointer-events: none;
        }

        .raw-eq-pad.snapshot-active::after {
            background: rgba(180, 190, 200, 0.08);
        }

        .raw-eq-spectrum {
            position: absolute;
            inset: 0;
            opacity: 0.42;
        }

        .raw-eq-snapshot-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            pointer-events: none;
            user-select: none;
        }

        .raw-eq-gridline {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(242, 242, 242, 0.5);
            transform: translateX(-50%);
            z-index: 2;
        }

        .raw-eq-node {
            position: absolute;
            width: clamp(34px, 4.8vw, 52px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.78);
            background: #d6aa21;
            transform: translate(-50%, -50%);
            z-index: 3;
            box-shadow: 0 0 20px rgba(214, 170, 33, 0.46);
        }

        .raw-eq-band-label,
        .raw-eq-freq-label {
            position: absolute;
            transform: translateX(-50%);
            z-index: 4;
            font-size: clamp(10px, 1.15vw, 13px);
            font-weight: 900;
            color: rgba(242,242,242,0.86);
            pointer-events: none;
        }

        .raw-eq-band-label {
            top: 8px;
        }

        .raw-eq-freq-label {
            bottom: 8px;
        }

        .raw-eq-q-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .raw-eq-q-cell .swipe-value {
            width: min(100%, 112px);

            border-color: #43d17b;

            padding: 10px;
            background: #1d2227;
            border: 1px solid #2c3237;
            border-radius: 7px;
        }

        .meter-channel.inactive {
            opacity: 0.34;
            filter: grayscale(1);
        }

        .meter-numbers {
            display: flex;
            gap: 10px;
            align-items: baseline;
            justify-content: space-between;
            min-width: 0;
        }

        .meter-label {

            font-weight: 900;
            min-width: 0;
            overflow-wrap: anywhere;
            line-height: 1.08;

            font-size: clamp(10px, 1.35vw, 16px);
        }

        .meter-label.compact-label {
            font-size: clamp(9px, 1.1vw, 13px);
            line-height: 1;
        }

        .meter-numbers {
            justify-content: flex-end;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: clamp(10px, 1.25vw, 14px);
            font-weight: 700;
        }

        .meter-wrap {
            position: relative;
            min-height: 42px;
            overflow: hidden;
            border: 1px solid #3b4249;
            border-radius: 6px;
            background: #0b0d0f;
        }

        .meter-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #145c2d 0%, #1fb96b 62%, #d6aa21 80%, #d06618 92%, #d93030 100%);
            transition: width 0.08s linear;
        }

        .meter-hold-line {
            position: absolute;
            top: 0;
            left: 0%;
            width: 3px;
            height: 100%;
            background: #f2f2f2;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.55);
        }

        .meter-scale {
            position: relative;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
        }

        .meter-tick {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            text-align: center;
        }

        .meter-tick::before {
            content: "";
            display: block;
            width: 1px;
            height: 7px;
            margin: 0 auto 2px;
            background: #687078;
        }

        .spectrum-panel {
            min-height: 0;
            position: relative;
            min-width: 0;
            padding: 10px;
            background: #1d2227;
            border: 1px solid #2c3237;
            border-radius: 7px;
        }

            display: block;
            width: 100%;
            height: 100%;

            border: 1px solid #3b4249;
            border-radius: 6px;
            background: #0b0d0f;

                padding: 4px 6px;
            }

            input[type="range"].v-fader {
                min-height: 86px;
            }
        }

</head>

                type: "writeEqParameter",
                channel: channel.midiKey,
                band: band,
                parameter: parameter,
                value: value

        function eqSupportedChannel(channel) {
            if (!channel) return false;

            if (!/^\d+$/.test(channel.midiKey)) return false;
            var number = parseInt(channel.midiKey, 10);
            return number >= 1 && number <= 12;
        }

        function sendEqControl(channel, control, value) {
            if (!eqSupportedChannel(channel)) return;
            var controls = channelControls(channel);
            sendAction({
                type: "engineEqIntent",
                channel: channel.midiKey,
                control: control,
                value: value,
                state: {
                    midFrequency: midFreqPresets[controls.midFreqIndex],
                    midGain: controls.midGain,
                    hpf: controls.hpf

            sendEqControl(channel, "midGain", controls.midGain);
            sendEqControl(channel, "highGain", controls.highGain);

        function sendCompressorControl(channel, presetName, controls) {

                type: "engineCompressorIntent",

        function sendMasterCompressorControl(master) {

                type: "engineMasterCompressorIntent",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    mode: state.mode

        function masterCompressorCommandTarget(master) {

        function sendMasterCompressorOn(master, enabled) {

                    type: "master",
                    id: master.id,
                    masterId: master.id,

        function sendMasterCompressorParameter(master, control, value) {

            if (control === "outGain") values.outGain = value;
            sendAction({
                type: "writeDynamicsBundle",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    mode: state.mode
                },
                values: values
            });

        function applyMasterCompressorPresetDefaults(master, presetId) {

            controls.outGain = defaults.outGain;
            controls.compOn = true;
            sendAction({
                type: "writeDynamicsBundle",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    mode: state.mode
                },
                values: {
                    on: true,
                    threshold: defaults.threshold,
                    ratio: defaults.ratio,
                    outGain: defaults.outGain
                }
            });
        }

        function masterEqTargetKey(master) {
            if (!master || master.id === "stereo") return "STEREO";
            return master.id.toUpperCase();
        }

        function sendMasterEqControl(master, control, value) {
            if (!master || master.id !== "stereo") return;
            var controls = masterEqControls(master);
            sendAction({
                type: "engineMasterEqIntent",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    targetKey: masterEqTargetKey(master),
                    mode: state.mode
                },
                control: control,
                value: value,
                state: {
                    low: controls.low,
                    lowFrequency: masterEqFreqPresets.low[controls.lowFreqIndex],
                    lowMid: controls.lowMid,
                    lowMidFrequency: masterEqFreqPresets.lowMid[controls.lowMidFreqIndex],
                    highMid: controls.highMid,
                    highMidFrequency: masterEqFreqPresets.highMid[controls.highMidFreqIndex],
                    high: controls.high,
                    highFrequency: masterEqFreqPresets.high[controls.highFreqIndex]
                }
            });
        }

        function sendAuxEqControl(master, control, value) {
            if (!master || master.id.indexOf("aux") !== 0) return;
            var controls = masterEqControls(master);
            sendAction({
                type: "engineAuxEqIntent",
                target: {
                    type: "master",
                    id: master.id,
                    masterId: master.id,
                    targetKey: masterEqTargetKey(master),
                    mode: state.mode
                },
                control: control,
                value: value,
                state: {
                    hpf: controls.auxHpf,
                    lowNotchFreq: controls.auxNotch1Freq,
                    lowNotchGain: auxNotchGainPresets[controls.auxNotch1GainIndex],
                    lowNotchInit: controls.auxNotch1Init,
                    highNotchFreq: controls.auxNotch2Freq,
                    highNotchGain: auxNotchGainPresets[controls.auxNotch2GainIndex],
                    highNotchInit: controls.auxNotch2Init,
                    presence: controls.auxPresence
                }
            });
        }

        function effectReturnTarget(channel) {
            if (!channel) return null;
            if (channel.id === "RTN1") return "RTN1";
            if (channel.id === "RTN2") return "RTN2";
            return null;
        }

        function sendEffectReturnEqControl(channel, control, value) {
            var targetKey = effectReturnTarget(channel);
            if (!targetKey) return;
            var controls = channelControls(channel);
            sendAction({
                type: "engineEffectReturnEqIntent",
                target: {
                    type: "return",
                    id: channel.id,
                    midiKey: targetKey,
                    targetKey: targetKey
                },
                control: control,
                value: value,
                state: {
                    hpf: controls.effectReturnHpf,
                    low: controls.effectReturnLow,
                    mid: controls.effectReturnMid,
                    air: controls.effectReturnAir
                }
            });
        }

        function sendAllChannelControls(channel) {
            var controls = channelControls(channel);
            if (channel.midiKey) {
                if (state.faders[channel.id] !== undefined) sendParameter(mixFaderParameter(channel), state.faders[channel.id]);
                sendParameterForSend(channel, "aux1", controls.aux1);
                sendParameterForSend(channel, "aux2", controls.aux2);
                sendParameterForSend(channel, "aux3", controls.aux3);
                sendParameterForSend(channel, "aux4", controls.aux4);
                sendParameterForSend(channel, "eff1", controls.eff1);
                sendParameterForSend(channel, "eff2", controls.eff2);
            }
            sendPanControl(channel, controls.pan);
            sendStereoSpreadControl(channel, controls.stereoSpreadMode, controls.stereoPan);
            sendEqControl(channel, "hpf", controls.hpf);
            sendEqControl(channel, "lowGain", controls.lowGain);
            sendEqControl(channel, "midFrequency", midFreqPresets[controls.midFreqIndex]);
            sendEqControl(channel, "midGain", controls.midGain);
            sendEqControl(channel, "highGain", controls.highGain);
            var presetName = compressorPresets[controls.compPresetIndex] || compressorPresets[0];
            if (channel.id !== "RTN1" && channel.id !== "RTN2") sendCompressorControl(channel, presetName, controls);
        }

        function sendPanControl(channel, value) {
            if (!channel) return;
            if (isStereoWidthSource(channel)) {
                sendStereoSpreadControl(channel, channelControls(channel).stereoSpreadMode, channelControls(channel).stereoPan);
                return;
            }
            if (channel.id === "RTN1" || channel.id === "RTN2") {
                var keys = stereoPanKeys(channel);
                var pairedValue = Math.round(((parseInt(value, 10) + 16) / 32) * 32);
                sendParameter("pan." + keys[0], pairedValue);
                sendParameter("pan." + keys[1], pairedValue);
                return;
            }
            var midiValue = Math.round(((parseInt(value, 10) + 16) / 32) * 32);
            sendParameter("pan." + channel.midiKey, midiValue);
        }

        function stereoPanKeys(channel) {
            if (!channel) return null;
            if (channel.id === "13_14") return ["CH13_L", "CH13_R"];
            if (channel.id === "15_16") return ["CH15_L", "CH15_R"];
            if (channel.id === "RTN1") return ["RTN1_L", "RTN1_R"];
            if (channel.id === "RTN2") return ["RTN2_L", "RTN2_R"];
            return null;
        }

        function phaseCapable(channel) {
            return !!channel && channel.id !== "RTN1" && channel.id !== "RTN2";
        }

        function isStereoWidthSource(channel) {
            return !!channel && (channel.id === "13_14" || channel.id === "15_16" || channel.id === "RTN1" || channel.id === "RTN2");
        }

        function sendStereoSpreadControl(channel, mode, pan) {
            var keys = stereoPanKeys(channel);
            if (!keys || !isStereoWidthSource(channel)) return;
            var config = stereoSpreadConfig[mode] || stereoSpreadConfig.Stereo;
            var panRange = config.panRange || [0, 0];
            var panValue = config.panDisabled ? 0 : Math.max(panRange[0], Math.min(panRange[1], parseInt(pan, 10) || 0));
            sendParameter("pan." + keys[0], config.left + panValue + 16);
            sendParameter("pan." + keys[1], config.right + panValue + 16);
            if (channel.id === "13_14") sendParameter("attenuator.CH13_14.level", 0x60);
            if (channel.id === "15_16") sendParameter("attenuator.CH15_16.level", 0x60);
        }

        function channelAttenuatorParameters(channel) {
            if (!channel || !channel.midiKey) return [];
            if (/^\d+$/.test(channel.midiKey)) {
                var number = parseInt(channel.midiKey, 10);
                return number >= 1 && number <= 16 ? ["attenuator." + channel.midiKey + ".level"] : [];
            }
            if (channel.id === "13_14") return ["attenuator.CH13_14.level"];
            if (channel.id === "15_16") return ["attenuator.CH15_16.level"];
            return [];
        }

        function attenuationDbToRaw(db) {
            var value = Math.max(-96, Math.min(0, parseFloat(db) || 0));
            return Math.round(value + 96);
        }

        function sendChannelAttenuation(channel, db) {
            channelAttenuatorParameters(channel).forEach(function(parameterId) {
                sendParameter(parameterId, attenuationDbToRaw(db));
            });
        }

        // Automatic EQ ATT is intentionally isolated here; this curve may be revised later.
        function autoAttenuationDb(settings) {
            var freqs = [63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000, 10000, 12500];
            function bell(f, f0, gain, q) {
                var oct = Math.log2(f / f0);
                var width = 1.4 / (q || 1);
                return gain * Math.exp(-0.5 * Math.pow(oct / width, 2));
            }
            function highShelf(f, gain, f0) {
                var x = Math.log2(f / (f0 || 8000));
                return gain / (1 + Math.exp(-4 * x));
            }
            var maxBoost = 0;
            freqs.forEach(function(f) {
                var boost =
                    bell(f, 125, settings.bassGain, 1) +
                    bell(f, settings.midFreq, settings.midGain, 1) +
                    highShelf(f, settings.highGain, 8000);
                maxBoost = Math.max(maxBoost, boost);
            });
            return Math.min(24, Math.max(0, maxBoost - 8));
        }

        function applyAutomaticEqAttenuation(channel) {
            if (!channelAttenuatorParameters(channel).length) return;
            var controls = channelControls(channel);
            var attenuation = autoAttenuationDb({
                bassGain: controls.lowGain,
                midGain: controls.midGain,
                midFreq: midFreqPresets[controls.midFreqIndex],
                highGain: controls.highGain
            });
            controls.eqAtt = -attenuation;
            sendChannelAttenuation(channel, controls.eqAtt);
        }

        function activeBank() {
            var fallback = banks.find(function(bank) { return !bank.disabled && !bank.hidden && !bank.page; });
            var bank = banks.find(function(bank) { return bank.id === state.bankId; }) || fallback;
            if (!bank || bank.disabled || bank.hidden || bank.page) return fallback;
            return bank;
        }

        function currentChannels() {
            return activeBank().channels;
        }

        function allChannels() {
            var all = [];
            banks.forEach(function(bank) {
                if (!bank.disabled && !bank.hidden && !bank.page) all = all.concat(bank.channels);
            });
            return all;
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function(char) {
                return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[char];
            });
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function dbToPercent(db, minDb, maxDb) {
            var value = clamp(parseFloat(db) || minDb, minDb, maxDb);
            return ((value - minDb) / (maxDb - minDb)) * 100;
        }

        function dbfs(value) {
            return Math.max(-60, 20 * Math.log10(Math.max(value, 1e-12)));
        }

        function lufsFromPower(power) {
            return Math.max(-70, -0.691 + 10 * Math.log10(Math.max(power, 1e-12)));
        }

        function createBallisticMeter(attackMs, releaseMs, rateHz) {
            function coeff(ms) {
                return Math.exp(-1 / ((ms / 1000) * rateHz));
            }
            return {
                value: -60,
                attackCoeff: coeff(attackMs),
                releaseCoeff: coeff(releaseMs),
                process: function(targetDb) {
                    var selectedCoeff = targetDb > this.value ? this.attackCoeff : this.releaseCoeff;
                    this.value = (selectedCoeff * this.value) + ((1 - selectedCoeff) * targetDb);
                    return this.value;
                }
            };
        }

        function resetAudioMeterData() {
            var meter = state.audioMeter;
            meter.leftPpm = createBallisticMeter(10, 1500, 30);
            meter.rightPpm = createBallisticMeter(10, 1500, 30);
            meter.leftPeakHold = -60;
            meter.rightPeakHold = -60;
            meter.leftPeakTime = 0;
            meter.rightPeakTime = 0;
            meter.integratedPower = 0;
            meter.lufsBlocks = 0;
            meter.spectrumSmoothed = [];
            meter.data = {
                left_rms: -60,
                right_rms: -60,
                left_ppm: -60,
                right_ppm: -60,
                left_peak: -60,
                right_peak: -60,
                left_peak_hold: -60,
                right_peak_hold: -60,
                momentary_lufs: -70,
                integrated_lufs: -70,
                spectrum: []
            };
        }

        function roundDb(value) {
            return Math.round(value * 10) / 10;
        }

        function fftRadix2(real, imag) {
            var n = real.length;
            var j = 0;
            for (var i = 1; i < n; i++) {
                var bit = n >> 1;
                while (j & bit) {
                    j ^= bit;
                    bit >>= 1;
                }
                j ^= bit;
                if (i < j) {
                    var realTemp = real[i];
                    var imagTemp = imag[i];
                    real[i] = real[j];
                    imag[i] = imag[j];
                    real[j] = realTemp;
                    imag[j] = imagTemp;
                }
            }

            for (var len = 2; len <= n; len <<= 1) {
                var angle = -2 * Math.PI / len;
                var wLenReal = Math.cos(angle);
                var wLenImag = Math.sin(angle);
                for (var offset = 0; offset < n; offset += len) {
                    var wReal = 1;
                    var wImag = 0;
                    for (var k = 0; k < len / 2; k++) {
                        var evenIndex = offset + k;
                        var oddIndex = evenIndex + len / 2;
                        var oddReal = (real[oddIndex] * wReal) - (imag[oddIndex] * wImag);
                        var oddImag = (real[oddIndex] * wImag) + (imag[oddIndex] * wReal);
                        real[oddIndex] = real[evenIndex] - oddReal;
                        imag[oddIndex] = imag[evenIndex] - oddImag;
                        real[evenIndex] += oddReal;
                        imag[evenIndex] += oddImag;
                        var nextWReal = (wReal * wLenReal) - (wImag * wLenImag);
                        wImag = (wReal * wLenImag) + (wImag * wLenReal);
                        wReal = nextWReal;
                    }
                }
            }
        }

        function computeSpectrum(monoSamples, sampleRate) {
            var meter = state.audioMeter;
            var fftSize = meter.fftSize || 2048;
            var real = new Float32Array(fftSize);
            var imag = new Float32Array(fftSize);
            for (var i = 0; i < fftSize; i++) {
                var sample = i < monoSamples.length ? monoSamples[i] : 0;
                var windowValue = 0.5 - (0.5 * Math.cos((2 * Math.PI * i) / (fftSize - 1)));
                real[i] = sample * windowValue;
            }

            fftRadix2(real, imag);

            var bins = fftSize / 2;
            var spectrum = new Array(bins);
            for (var bin = 0; bin < bins; bin++) {
                var magnitude = Math.sqrt((real[bin] * real[bin]) + (imag[bin] * imag[bin])) / (fftSize / 2);
                var db = 20 * Math.log10(Math.max(magnitude, 1e-12));
                spectrum[bin] = roundDb(clamp(db, -90, 0));
            }
            meter.sampleRate = sampleRate || meter.sampleRate || 44100;
            return spectrum;
        }

        function updatePeakHold(peakDb, channel) {
            var meter = state.audioMeter;
            var now = Date.now() / 1000;
            var holdKey = channel + "PeakHold";
            var timeKey = channel + "PeakTime";
            if (peakDb >= meter[holdKey] || (now - meter[timeKey]) > 2) {
                meter[holdKey] = peakDb;
                meter[timeKey] = now;
            }
            return meter[holdKey];
        }

        function processAudioMeterFrame(input) {
            var meter = state.audioMeter;
            var leftSum = 0;
            var rightSum = 0;
            var leftPeak = 0;
            var rightPeak = 0;
            var right = input.length > 1 ? input[1] : input[0];
            var length = input[0].length;
            var mono = new Float32Array(length);
            for (var i = 0; i < length; i++) {
                var l = input[0][i] || 0;
                var r = right[i] || 0;
                mono[i] = (l + r) * 0.5;
                leftSum += l * l;
                rightSum += r * r;
                leftPeak = Math.max(leftPeak, Math.abs(l));
                rightPeak = Math.max(rightPeak, Math.abs(r));
            }

            var leftRmsDb = dbfs(Math.sqrt(leftSum / length));
            var rightRmsDb = dbfs(Math.sqrt(rightSum / length));
            var leftPeakDb = dbfs(leftPeak);
            var rightPeakDb = dbfs(rightPeak);
            var stereoPower = ((leftSum / length) + (rightSum / length)) / 2;
            meter.integratedPower += stereoPower;
            meter.lufsBlocks += 1;
            meter.data = {
                left_rms: roundDb(leftRmsDb),
                right_rms: roundDb(rightRmsDb),
                left_ppm: roundDb(meter.leftPpm.process(leftRmsDb)),
                right_ppm: roundDb(meter.rightPpm.process(rightRmsDb)),
                left_peak: roundDb(leftPeakDb),
                right_peak: roundDb(rightPeakDb),
                left_peak_hold: roundDb(updatePeakHold(leftPeakDb, "left")),
                right_peak_hold: roundDb(updatePeakHold(rightPeakDb, "right")),
                momentary_lufs: roundDb(lufsFromPower(stereoPower)),
                integrated_lufs: roundDb(lufsFromPower(meter.integratedPower / meter.lufsBlocks)),
                spectrum: computeSpectrum(mono, meter.context ? meter.context.sampleRate : meter.sampleRate)
            };
            socket.emit("audio meter frame", {
                data: meter.data,
                sampleRate: meter.sampleRate,
                status: meter.status
            });
            updateAudioMeterDom();
        }

        function applyAudioMeterFrame(payload) {
            if (!payload || !payload.data || isAudioMeterSourceClient()) return;
            var meter = state.audioMeter;
            meter.sampleRate = payload.sampleRate || meter.sampleRate || 44100;
            meter.status = payload.status || "RECEIVING HOST METER";
            meter.data = Object.assign({}, meter.data, payload.data);
            rememberLastGoodSpectrum();
            updateAudioMeterDom();
        }

        function handleAudioMeterRequest(payload) {
            if (!isAudioMeterSourceClient()) return;
            if (!payload || payload.active !== false) startAudioMeter();
        }

        function meterAudioConstraints(deviceId) {
            var constraints = {
                channelCount: { ideal: Math.max(2, state.audioMeter.channelRightIndex + 1) },
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            };
            if (deviceId) constraints.deviceId = { exact: deviceId };
            return constraints;
        }

        function resolveMeterAudioConstraints() {
            var targetName = (state.audioMeter.deviceName || "").toLowerCase();
            if (!targetName || !navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                return Promise.resolve(meterAudioConstraints());
            }
            return navigator.mediaDevices.enumerateDevices().then(function(devices) {
                var input = devices.find(function(device) {
                    return device.kind === "audioinput" && device.label && device.label.toLowerCase().indexOf(targetName) !== -1;
                });
                return meterAudioConstraints(input && input.deviceId);
            }).catch(function() {
                return meterAudioConstraints();
            });
        }

        function applyMeterConfig(config) {
            if (!config || !config.audioChannels) return;
            var audioChannels = config.audioChannels;
            state.audioMeter.channelLeftIndex = Math.max(0, parseInt(audioChannels.left, 10) || 0);
            state.audioMeter.channelRightIndex = Math.max(0, parseInt(audioChannels.right, 10) || state.audioMeter.channelLeftIndex);
            state.audioMeter.channelLabel = audioChannels.label || ((state.audioMeter.channelLeftIndex + 1) + "-" + (state.audioMeter.channelRightIndex + 1));
            state.audioMeter.deviceName = config.audioDeviceName || "";
            state.audioMeter.optionalInputBankEnabled = !!config.optionalInputBankEnabled;
            banks.forEach(function(bank) {
                if (!bank.optionalInput) return;
                bank.hidden = !state.audioMeter.optionalInputBankEnabled;
                bank.disabled = !state.audioMeter.optionalInputBankEnabled;
            });
            if (activeBank().optionalInput && !state.audioMeter.optionalInputBankEnabled) state.bankId = "1-8";
            render();
        }

        function updateAudioMeterDom() {
            var data = state.audioMeter.data;
            var meterContext = meterDisplayContext();
            var rightPpmValue = meterContext.stereo ? data.right_ppm : -60;
            var rightRmsValue = meterContext.stereo ? data.right_rms : -60;
            var rightPeakValue = meterContext.stereo ? data.right_peak : -60;
            var rightHoldValue = meterContext.stereo ? data.right_peak_hold : -60;
            var pairs = {
                leftPpm: data.left_ppm,
                rightPpm: rightPpmValue,
                leftRms: data.left_rms,
                rightRms: rightRmsValue,
                leftPeak: data.left_peak,
                rightPeak: rightPeakValue,
                leftHold: data.left_peak_hold,
                rightHold: rightHoldValue,
                leftMeterLabel: meterContext.leftLabel,
                rightMeterLabel: meterContext.rightLabel
            };
            Object.keys(pairs).forEach(function(id) {
                var node = document.getElementById(id);
                if (node) {
                    node.textContent = pairs[id];
                    if (node.classList) {
                        var labelText = String(pairs[id] || "");
                        node.classList.toggle("sum-label", /sum of:/i.test(labelText));
                        node.classList.toggle("compact-label", labelText.length > 100);
                    }
                }
            });
            var leftBar = document.getElementById("leftBar");
            var rightBar = document.getElementById("rightBar");
            var leftHoldLine = document.getElementById("leftHoldLine");
            var rightHoldLine = document.getElementById("rightHoldLine");
            if (leftBar) leftBar.style.width = dbToPercent(data.left_ppm, -60, 0) + "%";

        function spectrumSnapshotDataUrl(data) {
            if (!isUsableRawEqSpectrum(data)) return "";
            var width = 420;
            var height = 220;
            var canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            var ctx = canvas.getContext("2d");
            var minDb = -90;
            var maxDb = 0;
            var sampleRate = state.audioMeter.sampleRate || 44100;
            var minFreq = 30;
            var maxFreq = Math.min(sampleRate / 2 || 20000, 20000);
            var barCount = 112;
            var gradient = ctx.createLinearGradient(0, height, 0, 0);
            gradient.addColorStop(0, "rgba(31,185,107,0.35)");
            gradient.addColorStop(0.7, "rgba(214,170,33,0.52)");
            gradient.addColorStop(1, "rgba(217,48,48,0.68)");
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = gradient;
            for (var bar = 0; bar < barCount; bar++) {
                var xNorm = barCount === 1 ? 0 : bar / (barCount - 1);
                var freq = minFreq * Math.pow(maxFreq / minFreq, xNorm);
                var bin = clamp(Math.round(freq / (sampleRate / 2) * (data.length - 1)), 0, data.length - 1);
                var value = clamp(data[bin], minDb, maxDb);
                var barHeight = Math.max(1, dbToPercent(value, minDb, maxDb) / 100 * height);
                var x = xNorm * width;
                ctx.fillRect(x, height - barHeight, Math.max(2, width / barCount - 1), barHeight);

        function drawSpectrum() {
            var canvas = document.getElementById("spectrumCanvas");
            if (!canvas) return;
            var data = state.audioMeter.data.spectrum || [];
            var meter = state.audioMeter;
            var rect = canvas.getBoundingClientRect();
            var width = Math.max(1, Math.floor(rect.width));
            var height = Math.max(1, Math.floor(rect.height));
            var ratio = window.devicePixelRatio || 1;
            if (canvas.width !== Math.floor(width * ratio) || canvas.height !== Math.floor(height * ratio)) {
                canvas.width = Math.floor(width * ratio);
                canvas.height = Math.floor(height * ratio);
            }

            var ctx = canvas.getContext("2d");
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "#0b0d0f";
            ctx.fillRect(0, 0, width, height);

            var minDb = -90;
            var maxDb = 0;
            var minFreq = 30;
            var maxFreq = Math.min(meter.sampleRate / 2 || 20000, 20000);
            var logRange = Math.log(maxFreq / minFreq);
            var plotHeight = Math.max(20, height - 20);
            ctx.strokeStyle = "rgba(104, 112, 120, 0.32)";
            ctx.lineWidth = 1;
            [-90, -72, -54, -36, -18].forEach(function(db) {
                var y = plotHeight - (dbToPercent(db, minDb, maxDb) / 100 * plotHeight);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            });

            [50, 100, 1000, 5000, 10000].forEach(function(freq) {
                if (freq < minFreq || freq > maxFreq) return;
                var x = Math.log(freq / minFreq) / logRange * width;
                ctx.strokeStyle = "rgba(242, 242, 242, 0.18)";
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, plotHeight);
                ctx.stroke();
                ctx.fillStyle = "#aeb6bf";
                ctx.font = "700 10px Arial, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                var label = freq >= 1000 ? (freq / 1000) + " kHz" : freq + " Hz";
                ctx.fillText(label, clamp(x, 24, width - 24), height - 3);
            });

            if (!data.length) return;
            var smoothed = meter.spectrumSmoothed || [];
            for (var i = 0; i < data.length; i++) {
                var target = clamp(data[i], minDb, maxDb);
                var previous = typeof smoothed[i] === "number" ? smoothed[i] : minDb;
                smoothed[i] = target > previous ? (previous * 0.45) + (target * 0.55) : Math.max(target, previous - 1.8);
            }
            meter.spectrumSmoothed = smoothed;

            var barCount = clamp(Math.floor(width / 4), 56, 180);
            var barWidth = Math.max(2, width / barCount - 1);
            var gradient = ctx.createLinearGradient(0, plotHeight, 0, 0);
            gradient.addColorStop(0, "#145c2d");
            gradient.addColorStop(0.58, "#1fb96b");
            gradient.addColorStop(0.78, "#d6aa21");
            gradient.addColorStop(1, "#d93030");
            ctx.fillStyle = gradient;
            for (var bar = 0; bar < barCount; bar++) {
                var xNorm = barCount === 1 ? 0 : bar / (barCount - 1);
                var freq = minFreq * Math.pow(maxFreq / minFreq, xNorm);
                var bin = clamp(Math.round(freq / (meter.sampleRate / 2) * (data.length - 1)), 0, data.length - 1);
                var value = clamp(smoothed[bin], minDb, maxDb);
                var valuePercent = dbToPercent(value, minDb, maxDb) / 100;
                var barHeight = Math.max(1, valuePercent * plotHeight);
                var x = xNorm * (width - barWidth);
                ctx.fillRect(x, plotHeight - barHeight, barWidth, barHeight);
            }
            rememberLastGoodSpectrum();
        }

            Array.prototype.forEach.call(document.querySelectorAll("[data-raw-eq-spectrum]"), function(canvas) {
                var ownerType = canvas.dataset.rawEqOwner;

                if (canvas.width !== Math.floor(width * ratio) || canvas.height !== Math.floor(height * ratio)) {
                    canvas.width = Math.floor(width * ratio);
                    canvas.height = Math.floor(height * ratio);

                var ctx = canvas.getContext("2d");
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

                if (!active || !data.length) return;

                var minDb = -90;
                var maxDb = 0;
                var sampleRate = state.audioMeter.sampleRate || 44100;
                var minFreq = 30;
                var maxFreq = Math.min(sampleRate / 2 || 20000, 20000);
                var barCount = clamp(Math.floor(width / 5), 36, 140);
                var gradient = ctx.createLinearGradient(0, height, 0, 0);
                gradient.addColorStop(0, "rgba(31,185,107,0.3)");
                gradient.addColorStop(0.7, "rgba(214,170,33,0.46)");
                gradient.addColorStop(1, "rgba(217,48,48,0.62)");
                ctx.fillStyle = gradient;
                for (var bar = 0; bar < barCount; bar++) {

                    var bin = clamp(Math.round(freq / (sampleRate / 2) * (data.length - 1)), 0, data.length - 1);
                    var value = clamp(data[bin], minDb, maxDb);
                    var barHeight = Math.max(1, dbToPercent(value, minDb, maxDb) / 100 * height);
                    var x = xNorm * width;
                    ctx.fillRect(x, height - barHeight, Math.max(2, width / barCount - 1), barHeight);

        }

        function stopAudioMeter() {
            var meter = state.audioMeter;
            meter.requestToken += 1;
            if (meter.processor) meter.processor.disconnect();
            if (meter.source) meter.source.disconnect();
            if (meter.stream) {
                meter.stream.getTracks().forEach(function(track) { track.stop(); });
            }
            if (meter.context && meter.context.state !== "closed") meter.context.close();
            meter.processor = null;
            meter.source = null;
            meter.stream = null;
            meter.context = null;
            meter.running = false;
            meter.requesting = false;
            meter.remoteRequesting = false;
            meter.status = "STOPPED";

        function startAudioMeter() {
            if (state.audioMeter.running || state.audioMeter.requesting) return;
            if (!isAudioMeterSourceClient()) {
                state.audioMeter.status = "RECEIVING HOST METER";
                if (!state.audioMeter.remoteRequesting) {

            state.audioMeter.requesting = true;
            state.audioMeter.status = "REQUESTING INPUT";
            var requestToken = state.audioMeter.requestToken + 1;
            state.audioMeter.requestToken = requestToken;

                    ]);

                source.connect(processor);
                processor.connect(context.destination);

                state.audioMeter.context = context;
                state.audioMeter.source = source;
                state.audioMeter.processor = processor;
                state.audioMeter.running = true;

            else if (event.group === "masterOn") changed = applyIncomingMasterOn(event);

            else if (event.group === "masterSolo") changed = applyIncomingMasterSolo(event);

        function activeMasterPage(master) {

                    } else {

        function faderParameter(channel) {

                var returnId = channel.id === "RTN1" ? "effRtn1" : "effRtn2";
                if (state.mode === "MIX") return mixFaderParameter(channel);
                if (state.mode === "AUX1") return "effectReturnSend.aux1." + returnId;
                if (state.mode === "AUX2") return "effectReturnSend.aux2." + returnId;
                if (state.mode === "AUX3") return "effectReturnSend.aux3." + returnId;
                if (state.mode === "AUX4") return "effectReturnSend.aux4." + returnId;
                if (state.mode === "EFF1") return channel.id === "RTN2" ? "effectReturnSend.eff1.effRtn2" : null;
                if (state.mode === "EFF2") return channel.id === "RTN1" ? "effectReturnSend.eff2.effRtn1" : null;
            }
            var group = faderGroupByMode[state.mode];
            if (!group) return null;
            return group + "." + channel.midiKey;
        }

        function mixFaderParameter(channel) {
            if (!channel) return null;
            if (channel.id === "RTN1") return "effectReturnSend.master.effRtn1";
            if (channel.id === "RTN2") return "effectReturnSend.master.effRtn2";
            return "channelFader." + channel.midiKey;
        }

        function sendControlIdForMode(mode) {
            return {
                AUX1: "aux1",
                AUX2: "aux2",
                AUX3: "aux3",
                AUX4: "aux4",
                EFF1: "eff1",
                EFF2: "eff2"
            }[mode];
        }

        function linkedAuxSendId(sendId) {
            if (state.auxLinks["1-2"]) {
                if (sendId === "aux1") return "aux2";
                if (sendId === "aux2") return "aux1";
            }
            if (state.auxLinks["3-4"]) {
                if (sendId === "aux3") return "aux4";
                if (sendId === "aux4") return "aux3";
            }
            return null;
        }

        function linkedAuxMode(mode) {
            var sendId = sendControlIdForMode(mode);
            var linked = linkedAuxSendId(sendId);
            return {
                aux1: "AUX1",
                aux2: "AUX2",
                aux3: "AUX3",
                aux4: "AUX4"
            }[linked] || null;
        }

        function isAuxModeLinked(mode) {
            var sendId = sendControlIdForMode(mode);
            return !!linkedAuxSendId(sendId);
        }

        function setAuxLink(pair, enabled) {
            state.auxLinks[pair] = !!enabled;
            render();
        }

        function faderValue(channel) {
            var sendId = sendControlIdForMode(state.mode);
            if (sendId) {
                var value = channelControls(channel)[sendId];
                return dbToMidi(value);
            }
            return state.faders[channel.id] || 0;
        }

        function updateChannelFaderState(channel, value) {
            var sendId = sendControlIdForMode(state.mode);
            var midiValue = parseInt(value, 10);
            if (sendId) {
                var dbValue = midiToDb(midiValue);
                var controls = channelControls(channel);
                controls[sendId] = dbValue;
                var linked = linkedAuxSendId(sendId);
                if (linked) controls[linked] = dbValue;
            } else {
                state.faders[channel.id] = midiValue;
            }
            return midiValue;
        }

        function dbToMidi(db) {
            var parsed = parseFloat(db);
            var value = Math.max(-70, Math.min(0, isNaN(parsed) ? -70 : parsed));
            var normalized = (value + 70) / 70;
            return Math.round(Math.pow(normalized, 1.8) * 127);
        }

        function midiToDb(value) {
            var normalized = Math.max(0, Math.min(127, parseInt(value, 10))) / 127;
            return Math.round(Math.pow(normalized, 1 / 1.8) * 70 - 70);
        }

        var rawEqBands = [
            { key: "low", band: "LOW", label: "LOW", qParam: "Q_OR_TYPE", defaultFreq: 80, defaultQ: 0x29 },
            { key: "lowMid", band: "LO_MID", label: "LO-MID", qParam: "Q", defaultFreq: 400, defaultQ: 0x14 },
            { key: "highMid", band: "HI_MID", label: "HI-MID", qParam: "Q", defaultFreq: 2000, defaultQ: 0x14 },
            { key: "high", band: "HIGH", label: "HIGH", qParam: "Q_OR_TYPE", defaultFreq: 10000, defaultQ: 0x2a }
        ];
        var rawEqTypeModes = {
            low: { normalMax: 0x28, shelf: 0x29, pass: 0x2c, passLabel: "HPF" },
            high: { normalMax: 0x28, shelf: 0x2a, pass: 0x2b, passLabel: "LPF" }
        };
        var rawEqNormalQLabels = [
            "10", "9.0", "8.0", "7.1", "6.3", "5.6", "5.0", "4.5", "4.0", "3.6",
            "3.2", "2.8", "2.5", "2.2", "2.0", "1.8", "1.6", "1.4", "1.2", "1.1",
            "1.0", "0.9", "0.8", "0.7", "0.63", "0.56", "0.50", "0.45", "0.40", "0.36",
            "0.32", "0.28", "0.25", "0.22", "0.20", "0.18", "0.16", "0.14", "0.12", "0.11",
            "0.10"
        ];

        function hzToRawEqFreq(hz) {
            var minHz = 20;
            var maxHz = 20000;
            var safe = Math.max(minHz, Math.min(maxHz, parseFloat(hz) || minHz));
            var ratio = (Math.log(safe) - Math.log(minHz)) / (Math.log(maxHz) - Math.log(minHz));
            return Math.round(ratio * 120);
        }

        function rawEqFreqToHz(raw) {
            var minHz = 20;
            var maxHz = 20000;
            var value = Math.max(0, Math.min(120, parseInt(raw, 10) || 0));
            return Math.round(minHz * Math.pow(maxHz / minHz, value / 120));
        }

        function rawEqGainToDb(raw) {
            return Math.round((Math.max(0, Math.min(72, parseInt(raw, 10) || 0)) / 2) - 18);
        }

        function rawEqDbToGain(db) {
            return eqGainDbToByte(db);
        }

        function rawEqTypeMode(bandKey) {
            return rawEqTypeModes[bandKey] || null;
        }

        function isRawEqPassFilter(bandKey, q) {
            var mode = rawEqTypeMode(bandKey);
            return !!(mode && parseInt(q, 10) === mode.pass);
        }

        function rawEqNormalQMax() {
            return rawEqNormalQLabels.length - 1;
        }

        function rawEqClampQValue(bandKey, q) {
            var value = parseInt(q, 10);
            if (isNaN(value)) value = 0x14;
            var mode = rawEqTypeMode(bandKey);
            if (mode && (value === mode.shelf || value === mode.pass)) return value;
            return Math.max(0, Math.min(rawEqNormalQMax(), value));
        }

        function rawEqQDisplay(bandKey, q) {
            var value = parseInt(q, 10);
            var mode = rawEqTypeMode(bandKey);
            if (mode) {
                if (value === mode.pass) return mode.passLabel;
                if (value === mode.shelf) return "SHELF";
            }
            value = rawEqClampQValue(bandKey, value);
            return rawEqNormalQLabels[value] || String(value);
        }

        function rawEqNextQValue(bandKey, current, step) {
            var value = rawEqClampQValue(bandKey, current);
            var mode = rawEqTypeMode(bandKey);
            if (!mode) return Math.max(0, Math.min(rawEqNormalQMax(), value + step));
            if (step > 0) {
                if (value < mode.normalMax) return value + 1;
                if (value === mode.normalMax) return mode.shelf;
                if (value === mode.pass) return 0;
                return mode.shelf;
            }
            if (value === mode.shelf) return mode.normalMax;
            if (value === mode.pass) return mode.pass;
            if (value === 0) return mode.pass;
            return Math.max(0, value - 1);
        }

        function applyRawEqQValue(raw, bandKey, next) {
            var item = raw[bandKey];
            if (!item) return false;
            var wasPass = isRawEqPassFilter(bandKey, item.q);
            var isPass = isRawEqPassFilter(bandKey, next);
            if (next === item.q) return false;
            item.q = next;
            if (isPass && !wasPass) item.gain = rawEqDbToGain(18);
            if (wasPass && !isPass) item.gain = rawEqDbToGain(0);
            return true;
        }

        function rawEqState(owner, isMaster) {
            var eq = isMaster ? masterEqControls(owner) : channelControls(owner);
            if (!eq.rawEq) eq.rawEq = {};
            rawEqBands.forEach(function(band) {
                if (!eq.rawEq[band.key]) {
                    eq.rawEq[band.key] = {
                        freq: hzToRawEqFreq(band.defaultFreq),
                        gain: rawEqDbToGain(0),
                        q: band.defaultQ
                    };
                }
            });
            return eq.rawEq;
        }

        function rawEqTarget(owner, isMaster) {
            if (isMaster) {
                return {
                    type: "master",
                    id: owner.id,
                    masterId: owner.id,
                    targetKey: masterEqTargetKey(owner),
                    mode: state.mode
                };
            }
            return { type: "channel", id: owner.id, midiKey: owner.midiKey };
        }

        function sendRawEq(owner, isMaster) {
            var raw = rawEqState(owner, isMaster);
            var bands = {};
            rawEqBands.forEach(function(band) {
                bands[band.band] = {
                    freq: raw[band.key].freq,
                    gain: raw[band.key].gain,
                    q: raw[band.key].q
                };
            });
            sendAction({
                type: "engineRawYamahaEqIntent",
                target: rawEqTarget(owner, isMaster),
                state: { bands: bands }
            });
        }

        function midiFaderValue(value) {
            var parsed = parseInt(value, 10);
            if (isNaN(parsed)) return 0;
            return Math.max(0, Math.min(127, parsed));
        }

        function setMasterFaderValue(parameter, value) {
            state.master[parameter] = midiFaderValue(value);

        }

        function setMode(mode) {

        function openMasterPage(mode, sendHardwareSelect) {
            state.mode = mode;

        function topModeTap(mode) {
            if (isMeterDelegationMode()) {
                var meterTapKey = "mode:" + mode;
                if (isMeterDoubleTap(meterTapKey)) {
                    cancelMeterSingleTap(meterTapKey);
                    exitMeterModeToBus(mode);
                    return;
                }
                scheduleMeterSingleTap(meterTapKey, function() {
                    if (!isMeterDelegationMode() || !canInvokeSolo()) return;
                    if (isOnlyMeterModeTarget(mode)) {
                        toggleMeterMasterDetail(mode);
                        return;
                    }
                    meterSelectMasterMode(mode);
                });
                return;
            }
            if (state.copy.phase === "source") {
                setMode(mode);
                setCopySource({ type: "bus", mode: mode });
                return;
            }
            if (state.copy.phase === "targets" && state.copy.source && state.copy.source.type === "bus" && mode !== "MIX") {
                setMode(mode);
                cycleBusCopyTarget(mode);
                return;
            }
            if (state.view === "strip") {
                resetNormalMasterTap();
                state.mode = mode;
                state.view = "mixer";
                selectMixerMasterBus(mode);
                render();
                return;
            }
            if (isNormalMasterDoubleTap(mode)) {
                enterMeterModeWithMaster(mode);
                return;
            }
            if (state.mode === mode) {
                if (state.view === "masterStrip" && state.selectedId === "master:" + mode) {
                    state.view = "mixer";
                    render();
                } else {
                    openMasterPage(mode, false);
                }
                return;
            }
            setMode(mode);
        }

        function topModeSwipe(fromMode, toMode) {
            if (fromMode === "AUX1" && toMode === "AUX2") {
                setAuxLink("1-2", true);
                return true;
            }
            if (fromMode === "AUX2" && toMode === "AUX1") {
                setAuxLink("1-2", false);
                return true;
            }
            if (fromMode === "AUX3" && toMode === "AUX4") {
                setAuxLink("3-4", true);
                return true;
            }
            if (fromMode === "AUX4" && toMode === "AUX3") {
                setAuxLink("3-4", false);
                return true;
            }
            return false;
        }

        function setBank(bankId) {
            var bank = banks.find(function(item) { return item.id === bankId; });
            if (!bank || bank.disabled || bank.hidden) return;
            if (isFreeOnlyBank(bank) && !isFreeMode()) return;
            if (isMeterDelegationMode() && !bank.page) {
                if (isMeterDoubleTap("bank:" + bankId)) {
                    exitMeterMode();
                }
                state.bankId = bankId;
                render();

            if (isMeterDelegationMode() && (bank.page === "scenes" || bank.page === "copy")) {
                exitMeterMode();

            if (bank.page === "copy") {
                copyButtonPress();

            }
            if (bank.page === "scenes") {
                if (state.view === "scenes" && state.previousViewBeforeScenes) {
                    state.view = state.previousViewBeforeScenes.view || "mixer";
                    state.selectedId = state.previousViewBeforeScenes.selectedId || state.selectedId;
                    state.selectedLabel = state.previousViewBeforeScenes.selectedLabel || state.selectedLabel;
                    state.previousViewBeforeScenes = null;

        function selectChannelByOffset(delta) {
            var liveBanks = banks.filter(function(bank) { return !bank.disabled && !bank.hidden && !bank.page; });
            var channels = currentChannels();
            var index = channels.findIndex(function(channel) { return channel.id === state.selectedId; });
            if (index < 0) index = 0;
            var nextIndex = index + delta;
            if (nextIndex < 0) {
                var bankIndex = liveBanks.findIndex(function(bank) { return bank.id === state.bankId; });
                var previousBank = liveBanks[bankIndex - 1] || liveBanks[liveBanks.length - 1];
                state.bankId = previousBank.id;
                channels = currentChannels();
                nextIndex = channels.length - 1;
            }
            if (nextIndex >= channels.length) {
                var currentBankIndex = liveBanks.findIndex(function(bank) { return bank.id === state.bankId; });
                var nextBank = liveBanks[currentBankIndex + 1] || liveBanks[0];
                state.bankId = nextBank.id;
                channels = currentChannels();
                nextIndex = 0;
            }
            var next = channels[nextIndex];
            if (!next) return;
            state.view = "strip";
            state.selectedId = next.id;
            state.selectedLabel = next.label;
            if (isMeterDelegationMode() && canInvokeSolo()) {
                prepareChannelSoloSelection(next, true);
                setChannelSoloState(next.id, true);
                setChannelSolo(next.soloKey, true);
                syncSoloRouting();

            selectMixerChannel(next);
            render();

            setChannelSoloState(channel.id, enabled);

        function meterSelectMasterMode(mode) {
            var master = masterByMode[mode];

            state.mode = mode;

                var returnId = mode === "EFF1" ? "RTN1" : "RTN2";
                var returnChannel = allChannels().find(function(channel) { return channel.id === returnId; });
                if (returnChannel) {
                    prepareChannelSoloSelection(returnChannel, true);

        function channelMeterLabel(channel) {
